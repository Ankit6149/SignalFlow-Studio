name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run Python tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  repair-x-thread-parser:
    if: github.event_name == 'pull_request' && github.head_ref == 'product/studio-luxury-ux' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: product/studio-luxury-ux
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Repair escaped regex
        run: python scripts/fix_x_thread_regex.py

      - name: Verify patch integrity
        run: git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build repaired frontend
        working-directory: frontend
        run: npm run build

      - name: Commit repair and remove runner
        run: |
          git config user.name "SignalFlow Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/app/page.js
          git commit -m "fix: preserve X thread separator regex"
          git rm scripts/fix_x_thread_regex.py
          git checkout origin/master -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml
          git commit -m "chore: remove X thread repair runner"

      - name: Push repaired branch
        run: git push origin HEAD:product/studio-luxury-ux
