name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  canonical-source-integration:
    if: github.event_name == 'pull_request' && github.head_ref == 'assets/canonical-source-artifact-contract' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Scope repeated transfer migration anchors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-canonical-source-contract.py")
          content = path.read_text(encoding="utf-8")
          helper_anchor = '''def insert_before(content: str, marker: str, addition: str, label: str) -> str:
              if addition.strip() in content:
                  return content
              return replace_once(content, marker, addition + marker, label)
          '''
          helper = helper_anchor + '''

          def replace_first(content: str, old: str, new: str, label: str) -> str:
              index = content.find(old)
              if index < 0:
                  raise RuntimeError(f"{label}: missing anchor")
              return content[:index] + new + content[index + len(old):]
          '''
          if helper_anchor not in content:
              raise SystemExit("canonical source migration helper anchor changed")
          content = content.replace(helper_anchor, helper, 1)
          start = content.index("def patch_transfer_application()")
          end = content.index("def patch_campaign_freshness()")
          section = content[start:end].replace("content = replace_once(", "content = replace_first(")
          content = content[:start] + section + content[end:]
          content = content.replace("    patch_page()\n", "", 1)
          path.write_text(content, encoding="utf-8")
          PY

      - name: Validate and apply canonical source migrations
        run: |
          python -m py_compile scripts/apply-domain-lifecycle-field-compatibility.py
          python -m py_compile scripts/apply-canonical-source-contract.py
          python -m py_compile scripts/apply-canonical-source-page.py
          python -m py_compile scripts/apply-canonical-source-reference-mapping.py
          python -m py_compile scripts/apply-canonical-source-compatibility.py
          python -m py_compile scripts/apply-canonical-source-hardening.py
          python -m py_compile scripts/apply-canonical-source-product.py
          python -m py_compile scripts/apply-canonical-source-legacy-compatibility.py
          python scripts/apply-domain-lifecycle-field-compatibility.py
          python scripts/apply-canonical-source-contract.py
          python scripts/apply-canonical-source-page.py
          python scripts/apply-canonical-source-reference-mapping.py
          python scripts/apply-canonical-source-compatibility.py
          python scripts/apply-canonical-source-hardening.py
          python scripts/apply-canonical-source-product.py
          python scripts/apply-canonical-source-legacy-compatibility.py
          git diff --check

      - name: Verify frontend contracts security migration and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Verify MCP server
        working-directory: mcp
        run: npm test

      - name: Verify Python compatibility suite
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pytest -q

      - name: Remove temporary integration files and restore ordinary CI
        run: |
          rm scripts/apply-domain-lifecycle-field-compatibility.py
          rm scripts/apply-canonical-source-contract.py
          rm scripts/apply-canonical-source-page.py
          rm scripts/apply-canonical-source-reference-mapping.py
          rm scripts/apply-canonical-source-compatibility.py
          rm scripts/apply-canonical-source-hardening.py
          rm scripts/apply-canonical-source-product.py
          rm scripts/apply-canonical-source-legacy-compatibility.py
          rm .github/workflows/apply-canonical-source-contract.yml
          rm -f canonical-source-failure-summary.txt
          rm -rf scripts/__pycache__
          git fetch origin master
          git checkout origin/master -- .github/workflows/ci.yml

      - name: Commit verified product integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: establish canonical source and asset graph"
          git push origin HEAD:${{ github.head_ref }}

  mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run MCP protocol and tool tests
        working-directory: mcp
        run: npm test

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run Python tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend regression tests
        working-directory: frontend
        run: npm test
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build
