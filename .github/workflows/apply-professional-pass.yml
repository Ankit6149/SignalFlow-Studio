name: Apply professional product pass

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'product/professional-polish-discovery' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: product/professional-polish-discovery
          fetch-depth: 0

      - name: Reconstruct reviewed release
        shell: bash
        run: |
          set -euo pipefail
          cat .github/payload/professional-pass-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/professional-pass.tar.gz
          tar -xzf /tmp/professional-pass.tar.gz -C .
          rm -rf .github/payload
          rm -f .github/workflows/apply-professional-pass.yml

      - name: Commit release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SignalFlow Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Polish SignalFlow into a professional multi-channel product" || exit 0
          git push origin HEAD:product/professional-polish-discovery
