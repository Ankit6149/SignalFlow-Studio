name: Apply edit-safe campaign version integration

on:
  push:
    branches:
      - stabilization/edit-safe-version-state
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-edit-safe-version-state
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/edit-safe-version-state
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate guarded migration scripts
        run: |
          python -m py_compile scripts/apply-edit_safe_version_state.py
          node --check scripts/update-campaign-version-docs.mjs

      - name: Apply Studio and documentation migrations
        run: |
          python scripts/apply-edit_safe_version_state.py
          node scripts/update-campaign-version-docs.mjs

      - name: Validate source formatting
        run: git diff --check

      - name: Install and verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Verify MCP server
        working-directory: mcp
        run: npm test

      - name: Verify Python compatibility suite
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pytest -q

      - name: Remove temporary integration files
        run: |
          rm scripts/apply-edit_safe_version_state.py
          rm scripts/update-campaign-version-docs.mjs
          rm .github/workflows/apply-edit-safe-version-state.yml
          rm -rf scripts/__pycache__

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: protect campaign edits and persist version state"
          git push origin HEAD:stabilization/edit-safe-version-state
