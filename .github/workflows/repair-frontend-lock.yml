name: Repair frontend lockfile

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh safe lockfile fixes
        working-directory: frontend
        run: npm audit fix --package-lock-only --omit=dev
      - name: Commit lockfile update when needed
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "No lockfile change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "fix(deps): refresh safe frontend audit resolution"
          git push origin HEAD:${{ github.head_ref }}
