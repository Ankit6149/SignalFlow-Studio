name: Apply Identity Registration

on:
  push:
    branches: [feat/golden-path-voice-identity]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/golden-path-voice-identity
      - name: Register identity domain and route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          identity = Path('frontend/lib/domain/identityProfiles.mjs')
          text = identity.read_text()
          text = text.replace(
              'const parsed = input?.kind === kind ? parseDomainRecord(input, kind) : input;',
              'const parsed = input?.kind === kind && input?.schemaVersion ? parseDomainRecord(input, kind) : input;',
              1,
          )
          text = text.replace(
              'const parsed = input?.kind === IDENTITY_RECORD_KINDS.CONTEXT_SNAPSHOT\n    ? parseDomainRecord(input, IDENTITY_RECORD_KINDS.CONTEXT_SNAPSHOT)\n    : input;',
              'const parsed = input?.kind === IDENTITY_RECORD_KINDS.CONTEXT_SNAPSHOT && input?.schemaVersion\n    ? parseDomainRecord(input, IDENTITY_RECORD_KINDS.CONTEXT_SNAPSHOT)\n    : input;',
              1,
          )
          identity.write_text(text)

          ports = Path('frontend/lib/domain/ports.mjs')
          text = ports.read_text()
          marker = '  contentOpportunityRepository: ["list", "get", "upsert", "remove"],\n'
          if 'identityRepository:' not in text:
              if marker not in text: raise SystemExit('ports marker missing')
              text = text.replace(marker, marker + '  identityRepository: ["list", "get", "upsert", "remove"],\n', 1)
          ports.write_text(text)

          contracts = Path('frontend/lib/domain/contracts.mjs')
          text = contracts.read_text()
          kind_marker = '  CONTENT_OPPORTUNITY: "ContentOpportunity",\n'
          kind_add = '''  IDENTITY_PROFILE: "IdentityProfile",\n  PERCEPTION_PROFILE: "PerceptionProfile",\n  VOICE_PROFILE: "VoiceProfile",\n  BOUNDARY_PROFILE: "BoundaryProfile",\n  PLATFORM_EXPRESSION_PROFILE: "PlatformExpressionProfile",\n  PROJECT_GUIDANCE_PROFILE: "ProjectGuidanceProfile",\n  IDENTITY_CONTEXT_SNAPSHOT: "IdentityContextSnapshot",\n'''
          if 'IDENTITY_PROFILE: "IdentityProfile"' not in text:
              if kind_marker not in text: raise SystemExit('kind marker missing')
              text = text.replace(kind_marker, kind_marker + kind_add, 1)
          contract_marker = '  ContentOpportunity: { idField: "opportunityId", owner: "workspace", required: ["opportunityId", "workspaceId", "signalIds", "recommendation", "title", "status", "evaluationProvenance"] },\n'
          contract_add = '''  IdentityProfile: { idField: "identityProfileId", owner: "workspace", required: ["identityProfileId", "workspaceId", "userId", "version"] },\n  PerceptionProfile: { idField: "perceptionProfileId", owner: "workspace", required: ["perceptionProfileId", "workspaceId", "userId", "version"] },\n  VoiceProfile: { idField: "voiceProfileId", owner: "workspace", required: ["voiceProfileId", "workspaceId", "userId", "version"] },\n  BoundaryProfile: { idField: "boundaryProfileId", owner: "workspace", required: ["boundaryProfileId", "workspaceId", "userId", "version"] },\n  PlatformExpressionProfile: { idField: "platformExpressionProfileId", owner: "workspace", required: ["platformExpressionProfileId", "workspaceId", "userId", "version", "platform"] },\n  ProjectGuidanceProfile: { idField: "projectGuidanceProfileId", owner: "workspace", required: ["projectGuidanceProfileId", "workspaceId", "userId", "version", "projectId"] },\n  IdentityContextSnapshot: { idField: "identityContextSnapshotId", owner: "workspace", required: ["identityContextSnapshotId", "workspaceId", "userId", "profileRefs", "precedence", "createdAt"] },\n'''
          if 'IdentityProfile: { idField:' not in text:
              if contract_marker not in text: raise SystemExit('contract marker missing')
              text = text.replace(contract_marker, contract_marker + contract_add, 1)
          contracts.write_text(text)

          shell = Path('frontend/components/WorkspaceShell.js')
          text = shell.read_text()
          text = text.replace(
              '{ id: "voice", label: "Voice", status: "planned" },',
              '{ id: "voice", label: "Voice", href: "/voice", status: "available" },',
              1,
          )
          shell.write_text(text)

          domain_test = Path('frontend/tests/domainContracts.test.mjs')
          text = domain_test.read_text()
          marker = '  Campaign: { campaignId: "campaign-1", title: "Campaign", drafts: { linkedin: {} } },\n'
          samples = '''  IdentityProfile: { identityProfileId: "identity-1", workspaceId: "workspace-1", userId: "user-1", version: 1 },\n  PerceptionProfile: { perceptionProfileId: "perception-1", workspaceId: "workspace-1", userId: "user-1", version: 1 },\n  VoiceProfile: { voiceProfileId: "voice-1", workspaceId: "workspace-1", userId: "user-1", version: 1 },\n  BoundaryProfile: { boundaryProfileId: "boundary-1", workspaceId: "workspace-1", userId: "user-1", version: 1 },\n  PlatformExpressionProfile: { platformExpressionProfileId: "platform-1", workspaceId: "workspace-1", userId: "user-1", version: 1, platform: "linkedin" },\n  ProjectGuidanceProfile: { projectGuidanceProfileId: "project-guidance-1", workspaceId: "workspace-1", userId: "user-1", version: 1, projectId: "project-1" },\n  IdentityContextSnapshot: { identityContextSnapshotId: "identity-context-1", workspaceId: "workspace-1", userId: "user-1", profileRefs: {}, precedence: ["explicit_boundary"], createdAt: "2026-08-17T11:00:00.000Z" },\n'''
          if 'IdentityProfile: { identityProfileId:' not in text:
              if marker not in text: raise SystemExit('domain sample marker missing')
              text = text.replace(marker, samples + marker, 1)
          domain_test.write_text(text)
          PY
      - name: Commit registration
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/domain/identityProfiles.mjs frontend/lib/domain/ports.mjs frontend/lib/domain/contracts.mjs frontend/components/WorkspaceShell.js frontend/tests/domainContracts.test.mjs
          git commit -m "feat(identity): register versioned profile contracts and Voice route"
          git push origin HEAD:feat/golden-path-voice-identity
