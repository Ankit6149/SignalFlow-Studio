name: Apply focused wizard fix

on:
  push:
    branches:
      - fix/focused-three-step-wizard

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/focused-three-step-wizard
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply focused wizard migration
        run: node scripts/apply-focused-wizard-fix.mjs

      - name: Remove one-time migration files
        run: |
          rm scripts/apply-focused-wizard-fix.mjs
          rm .github/workflows/apply-focused-wizard-fix.yml

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/page.js frontend/app/app-workspace.css scripts/apply-focused-wizard-fix.mjs .github/workflows/apply-focused-wizard-fix.yml
          git commit -m "fix: separate campaign creation into focused wizard steps"
          git push origin HEAD:fix/focused-three-step-wizard
