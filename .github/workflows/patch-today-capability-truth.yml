name: Patch Today capability truth

on:
  push:
    branches:
      - feat/today-decision-inbox

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/today-decision-inbox
      - name: Update only stale Today capability statements
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/CAPABILITY_MATRIX.md')
          text = path.read_text()
          replacements = {
            '| Today decision inbox | Planned | #159 |': '| Today decision inbox | Implemented browser-local as a derived exact-revision judgment queue over canonical Golden Path records; automatic Signal→review-ready orchestration is still planned | #159/#166/#204 |',
            '`evidence_critique`, , `authenticity_critique`': '`evidence_critique`, `authenticity_critique`',
            'Automatic signal ingestion, connected-source intelligence, memory-aware opportunity ranking, StyleMemory, NarrativeMemory, Today, publishing and broader hosted persistence remain target capabilities until their owning issues are complete.': 'Automatic signal ingestion, connected-source intelligence, memory-aware opportunity ranking, automatic Signal→review-ready orchestration, StyleMemory, NarrativeMemory, publishing and broader hosted persistence remain target capabilities until their owning issues are complete. The browser-local Today decision inbox is implemented as a derived view over exact reviewed current revisions; it does not create a second workflow state store.',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing expected capability text: {old}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit truth update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CAPABILITY_MATRIX.md
          git commit -m "docs: mark Today decision inbox implemented"
          git push origin HEAD:feat/today-decision-inbox
