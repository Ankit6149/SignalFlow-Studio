name: Baseline UI diagnostics

on:
  push:
    branches:
      - fix/restore-green-baseline-after-234

jobs:
  ui-contract:
    name: ui-contract (${{ matrix.test }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - landingAccessibilityTruth.test.mjs
          - landingCopyDensity.test.mjs
          - landingCurrentCapabilities.test.mjs
          - landingFinalCTA.test.mjs
          - landingFlowContract.test.mjs
          - landingFooterTruth.test.mjs
          - landingHeroCopy.test.mjs
          - landingMediaTruth.test.mjs
          - landingNoExternalAssetDependency.test.mjs
          - landingNoFalseAutomation.test.mjs
          - landingPageRevamp.test.mjs
          - landingProductTruth.test.mjs
          - landingRhythmAndBrand.test.mjs
          - landingSectionCount.test.mjs
          - landingSignalsLink.test.mjs
          - landingTrustTruth.test.mjs
          - landingTruthDoc.test.mjs
          - landingVisualStructure.test.mjs
          - workspaceAccessibility.test.mjs
          - workspaceShellProductIntegration.test.mjs
          - workspaceShellScrollAndBrand.test.mjs
          - shellLayout.test.mjs
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/${{ matrix.test }}
