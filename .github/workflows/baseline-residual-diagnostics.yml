name: Baseline Residual Diagnostics

on:
  push:
    branches:
      - fix/restore-green-baseline-after-234

jobs:
  frontend-test-groups:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [a-d, e-l, m-r, s-z]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run ${{ matrix.group }} frontend tests
        working-directory: frontend
        shell: bash
        run: |
          case "${{ matrix.group }}" in
            a-d) node --test tests/[a-d]*.test.mjs ;;
            e-l) node --test tests/[e-l]*.test.mjs ;;
            m-r) node --test tests/[m-r]*.test.mjs ;;
            s-z) node --test tests/[s-z]*.test.mjs ;;
          esac
