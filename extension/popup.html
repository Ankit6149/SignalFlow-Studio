<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SignalFlow Studio Clip</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      width: 340px;
      margin: 0;
      padding: 18px;
      background: #f8f6f0;
      color: #1b1b18;
    }
    header { margin-bottom: 14px; }
    h1 {
      margin: 0 0 5px;
      font-family: Georgia, serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: #66645d;
      font-size: 12px;
      line-height: 1.5;
    }
    .capability-status {
      margin: 0 0 14px;
      padding: 10px 11px;
      border: 1px solid #d8d3c7;
      border-radius: 8px;
      background: #fffdf8;
      color: #5d5a52;
      font-size: 11px;
      line-height: 1.45;
    }
    .capability-status[data-state="ready"] { border-color: #92b59b; color: #315c3c; }
    .capability-status[data-state="blocked"],
    .capability-status[data-state="error"] { border-color: #d6a5a0; color: #7b332d; }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    label {
      font-size: 11px;
      font-weight: 650;
      color: #4e4c46;
    }
    textarea, input {
      width: 100%;
      border: 1px solid #cbc6ba;
      border-radius: 8px;
      padding: 9px 10px;
      background: #fff;
      color: #1b1b18;
      font: inherit;
      font-size: 12px;
      line-height: 1.45;
    }
    textarea { resize: vertical; min-height: 92px; }
    textarea:focus, input:focus, button:focus-visible {
      outline: 2px solid #9b7a31;
      outline-offset: 2px;
    }
    button {
      width: 100%;
      margin-top: 8px;
      border: 1px solid #1b1b18;
      border-radius: 8px;
      padding: 10px 12px;
      background: #1b1b18;
      color: #fffdf8;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #34342f; }
    button:disabled { cursor: not-allowed; opacity: 0.48; }
    .secondary-btn {
      border-color: #cbc6ba;
      background: transparent;
      color: #34342f;
    }
    .secondary-btn:hover:not(:disabled) { background: #eeebe3; }
    .status {
      margin-top: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      background: #ebe8df;
      color: #4e4c46;
      font-size: 11px;
      line-height: 1.4;
    }
    .status[data-type="success"] { background: #e5f0e7; color: #315c3c; }
    .status[data-type="error"] { background: #f4e6e4; color: #7b332d; }
    .destination {
      margin-top: 16px;
      padding-top: 13px;
      border-top: 1px solid #d8d3c7;
    }
    .destination small {
      display: block;
      margin-top: 5px;
      color: #77746d;
      font-size: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <h1>SignalFlow Studio Clip</h1>
    <p>Review what the connected deployment can receive before sending page context.</p>
  </header>

  <div id="capability-status" class="capability-status" data-state="loading" role="status" aria-live="polite">
    Checking the connected SignalFlow deployment…
  </div>

  <div class="form-group">
    <label for="tab-url">Current tab URL</label>
    <input type="text" id="tab-url" readonly>
  </div>

  <div class="form-group">
    <label for="notes">Capture note</label>
    <textarea id="notes" rows="4" placeholder="What should SignalFlow understand or create from this page?"></textarea>
  </div>

  <button id="send-btn" type="button" disabled>Send to SignalFlow</button>
  <button id="open-btn" type="button" class="secondary-btn">Open Studio workspace</button>

  <div id="status-msg" class="status" role="status" aria-live="polite" hidden></div>

  <div class="destination">
    <div class="form-group">
      <label for="studio-url">SignalFlow deployment URL</label>
      <input type="url" id="studio-url" value="http://localhost:3000" inputmode="url">
      <small>The extension verifies this deployment’s capability contract before enabling delivery.</small>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
