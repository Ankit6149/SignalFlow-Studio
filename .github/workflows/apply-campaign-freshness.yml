name: Apply campaign freshness integration

on:
  push:
    branches:
      - stabilization/campaign-state-integrity
    paths:
      - .github/workflows/apply-campaign-freshness.yml
      - scripts/apply-campaign-freshness.mjs

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/campaign-state-integrity
          fetch-depth: 0

      - name: Detect integration work
        id: integration
        shell: bash
        run: |
          if [ -f scripts/apply-campaign-freshness.mjs ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.integration.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply source transformation
        if: steps.integration.outputs.run == 'true'
        run: node scripts/apply-campaign-freshness.mjs

      - name: Install frontend dependencies
        if: steps.integration.outputs.run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Run frontend regression tests
        if: steps.integration.outputs.run == 'true'
        working-directory: frontend
        run: npm test

      - name: Audit frontend production dependencies
        if: steps.integration.outputs.run == 'true'
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        if: steps.integration.outputs.run == 'true'
        working-directory: frontend
        run: npm run build

      - name: Run MCP tests
        if: steps.integration.outputs.run == 'true'
        working-directory: mcp
        run: npm test

      - name: Remove temporary integration files
        if: steps.integration.outputs.run == 'true'
        run: rm .github/workflows/apply-campaign-freshness.yml scripts/apply-campaign-freshness.mjs

      - name: Commit verified integration
        if: steps.integration.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: track campaign source freshness"
          git push origin HEAD:stabilization/campaign-state-integrity
