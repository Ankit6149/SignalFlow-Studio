name: Apply capability and atomic generation integration

on:
  push:
    branches:
      - stabilization/capability-atomic-generation
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-capability-atomic-generation
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/capability-atomic-generation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Apply verified source integrations
        run: |
          node scripts/apply-capability-atomic-generation.mjs
          node scripts/fix-capability-contract.mjs

      - name: Validate extension JavaScript
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js

      - name: Install and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Test MCP server
        working-directory: mcp
        run: npm test

      - name: Test Python services
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pytest -q

      - name: Remove temporary integration files
        run: |
          rm scripts/apply-capability-atomic-generation.mjs
          rm scripts/fix-capability-contract.mjs
          rm .github/workflows/apply-capability-atomic-generation.yml

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add capability contract and atomic generation acceptance"
          git push origin HEAD:stabilization/capability-atomic-generation
