name: One-shot historical branch cleanup

on:
  push:
    branches:
      - feat/gp2-hosted-screenshot-production-binding
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete audited historical branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              "audit/public-product-reliability",
              "chore/repository-truth-reset",
              "design/landing-premium-consistency",
              "docs/content-operating-system-reset",
              "docs/inference-privacy-client-architecture",
              "docs/media-intelligence-creative-production",
              "docs/record-gp2-screenshot-phase-a",
              "feat/content-signal-manual-intake",
              "feat/exact-capture-job-claim",
              "feat/github-app-connection-lifecycle",
              "feat/github-durable-webhook",
              "feat/github-first-opportunity",
              "feat/github-opportunity-continuation",
              "feat/github-repository-bootstrap",
              "feat/github-signal-ingestion-core",
              "feat/golden-narrative-memory",
              "feat/golden-path-autopilot",
              "feat/golden-path-change-request",
              "feat/golden-path-manual-opportunity",
              "feat/golden-path-opportunity-plan",
              "feat/golden-path-platform-generation",
              "feat/golden-path-review-approval",
              "feat/golden-path-strategy-content",
              "feat/golden-path-voice-identity",
              "feat/golden-style-memory-core",
              "feat/golden-style-memory-generation",
              "feat/gp2-exact-media-review-binding",
              "feat/gp2-hosted-exact-asset-preview",
              "feat/gp2-hosted-owner-review-ui",
              "feat/gp2-hosted-platform-review-state",
              "feat/gp2-hosted-review-preview-wiring",
              "feat/gp2-real-screenshot-capture",
              "feat/gp2-screenshot-quality-derivatives",
              "feat/hosted-opportunity-inbox",
              "feat/hosted-planning-continuity",
              "feat/hosted-project-context-postgres",
              "feat/landing-content-os-refactor",
              "feat/landing-visual-redesign",
              "feat/logo-flow-ui-redesign",
              "feat/media-jobs-capture-foundation",
              "feat/premium-editorial-ui-correction",
              "feat/private-blob-storage-foundation",
              "feat/product-shell-redesign",
              "feat/project-context-bootstrap",
              "feat/project-context-opportunity-continuation",
              "feat/revision-history-judgment",
              "feat/style-memory-consumption-controls",
              "feat/today-decision-inbox",
              "feat/unified-workspace-shell",
              "fix/canonical-channel-identifiers",
              "fix/landing-metadata-content-os",
              "fix/landing-visual-composition",
              "fix/media-jobs-capture-clean",
              "fix/restore-green-baseline-after-234",
              "fix/review-first-publishing",
              "fix/review-first-publishing-final",
              "fix/studio-step-isolation",
              "fix/studio-wide-layout-clipboard-images",
              "fix/weekend-complete-zip-export",
              "fix/weekend-output-truth",
              "fix/weekend-v1-reliability",
              "fix/125-responsive-studio-clean",
              "fix/126-workspace-accessibility",
              "fix/135-137-rendered-responsive-ui",
              "fix/135-public-landing-revamp",
              "placeholder-never",
              "refactor/landing-workspace-rhythm",
              "refactor/studio-decision-flow",
              "refactor/workspace-shell-spacing",
              "test/golden-path-owner-acceptance",
              "tmp-ignore"
            ];

            const protectedBranches = new Set([
              "master",
              "feat/gp2-hosted-screenshot-production-binding",
              "feat/editorial-execution-layer"
            ]);

            for (const branch of branches) {
              if (protectedBranches.has(branch)) {
                core.setFailed(`Refusing to delete protected branch ${branch}`);
                return;
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted ${branch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Already absent or non-deletable: ${branch}`);
                  continue;
                }
                throw error;
              }
            }
