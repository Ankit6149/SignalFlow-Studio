name: Update Review Capability Truth

on:
  push:
    branches: [feat/golden-path-review-approval]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/golden-path-review-approval
      - name: Update capability truth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"pattern missing in {path}: {old[:140]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'README.md',
              '- create and version browser-local explicit Identity, Desired Perception, Voice, Boundary, LinkedIn/X Platform Expression, and optional Project Guidance records at `/voice`, including immutable `IdentityContextSnapshot` records for exact downstream generation context;\n- use real configured model-provider routes;',
              '- create and version browser-local explicit Identity, Desired Perception, Voice, Boundary, LinkedIn/X Platform Expression, and optional Project Guidance records at `/voice`, including immutable `IdentityContextSnapshot` records for exact downstream generation context;\n- move a manual Signal through persisted Opportunity/angle selection, approved NarrativeStrategy, canonical ContentPiece, destination-specific immutable LinkedIn/X revisions, separate evidence/authenticity checks, immutable owner edits/regeneration, and exact per-revision approve/reject decisions in `/plan`;\n- use real configured model-provider routes;',
          )

          replace(
              'docs/CAPABILITY_MATRIX.md',
              '| Staged generation orchestration | Partially implemented: `opportunity_evaluation` → `narrative_strategy` → destination-specific `platform_variant` writing with immutable LinkedIn/X revisions; critics, bounded targeted revision, durable jobs and broader stages remain planned | #158/#166 |',
              '| Staged generation orchestration | Partially implemented: `opportunity_evaluation` → `narrative_strategy` → destination-specific `platform_variant` writing → separate `evidence_critique` + `authenticity_critique` → exact human review/approval; natural-language targeted change requests, durable jobs and broader stages remain planned | #158/#166 |',
          )
          replace(
              'docs/CAPABILITY_MATRIX.md',
              '| Authenticity quality critic | Planned | #158 |',
              '| Authenticity quality critic | Implemented browser-local for the owner Golden Path against the exact destination-specific IdentityContextSnapshot used by the current revision; broader automated learning remains planned | #158/#166 |',
          )
          replace(
              'docs/CAPABILITY_MATRIX.md',
              '| Evidence/factual quality critic integrated with staged flow | Planned | #158 |',
              '| Evidence/factual quality critic integrated with staged flow | Implemented browser-local for exact current LinkedIn/X revisions using the canonical source Signal/approved strategy/ContentPiece evidence contract; broader source processors remain planned | #158/#166 |',
          )
          replace(
              'docs/CAPABILITY_MATRIX.md',
              '| Plan/opportunity/campaign-planning workspace | Implemented browser-local through opportunity explanation, angle/custom-angle decision, reviewable/approvable NarrativeStrategy, canonical ContentPiece and read-only generated LinkedIn/X review revisions; editing/critics/exact draft approval remain planned | #156/#157/#158/#159/#166 |',
              '| Plan/opportunity/campaign-planning workspace | Implemented browser-local through opportunity explanation, angle/custom-angle decision, reviewable/approvable NarrativeStrategy, canonical ContentPiece, immutable LinkedIn/X revision history, separate critics, immutable owner edits/regeneration, and exact per-revision approve/reject decisions | #156/#157/#158/#159/#166 |',
          )
          replace(
              'docs/CAPABILITY_MATRIX.md',
              '| Provider-neutral InferenceTask/routing/policy fabric | Thin task/adapter + server privacy-route enforcement implemented for `opportunity_evaluation`, `narrative_strategy`, and `platform_variant`; full capability registry, metering, fallback and Private Hybrid remain planned | #170/#171/#172 |',
              '| Provider-neutral InferenceTask/routing/policy fabric | Thin task/adapter + server privacy-route enforcement implemented for `opportunity_evaluation`, `narrative_strategy`, `platform_variant`, `evidence_critique`, and `authenticity_critique`; full capability registry, metering, fallback and Private Hybrid remain planned | #170/#171/#172 |',
          )
          replace(
              'docs/CAPABILITY_MATRIX.md',
              '| Owner Golden Path 1 manual thought → authentic approval | In progress: implemented through manual Signal → Opportunity/angle → explicit Voice → approved NarrativeStrategy → ContentPiece → destination-specific immutable read-only LinkedIn/X `PlatformVariantRevision`; authenticity/evidence critics, editing/change requests, exact draft approval and NarrativeMemory remain pending | #166 |',
              '| Owner Golden Path 1 manual thought → authentic approval | In progress: implemented through manual Signal → Opportunity/angle → explicit Voice → approved NarrativeStrategy → ContentPiece → immutable LinkedIn/X revisions → separate evidence/authenticity checks → immutable owner edit/regenerate → exact revision approve/reject; natural-language change requests plus feedback/StyleMemory learning remain pending | #166 |',
          )
          replace(
              'docs/CAPABILITY_MATRIX.md',
              'The owner-first browser-local path now implements manual `ContentSignal`, persisted `ContentOpportunity` evaluation/angle selection, explicit versioned Identity/Perception/Voice/Boundary context, reviewable/approvable `NarrativeStrategy`, canonical `ContentPiece`/LinkedIn-X `PlatformVariant`, and immutable generated `PlatformVariantRevision` records that stop at review state.\n\nAutomatic signal ingestion, connected-source intelligence, memory-aware opportunity ranking, StyleMemory, NarrativeMemory, Today, critics, exact draft approval and broader hosted persistence remain target capabilities until their owning issues are complete.',
              'The owner-first browser-local path now implements manual `ContentSignal`, persisted `ContentOpportunity` evaluation/angle selection, explicit versioned Identity/Perception/Voice/Boundary context, reviewable/approvable `NarrativeStrategy`, canonical `ContentPiece`/LinkedIn-X `PlatformVariant`, immutable generated/edited `PlatformVariantRevision` history, separate evidence/authenticity critics, and exact per-revision human approve/reject decisions.\n\nAutomatic signal ingestion, connected-source intelligence, memory-aware opportunity ranking, StyleMemory, NarrativeMemory, Today, natural-language targeted change requests, publishing and broader hosted persistence remain target capabilities until their owning issues are complete.',
          )
          replace(
              'docs/CAPABILITY_MATRIX.md',
              '- a generated `PlatformVariantRevision` is **not approved content** merely because it exists; current Golden Path output stops at read-only review until the critic/edit/approval slice ships;',
              '- a generated `PlatformVariantRevision` is **not approved content** merely because it exists; approval is a separate exact-revision decision that is invalidated for the current path when a newer edit/regeneration becomes current;',
          )

          replace(
              'AGENTS.md',
              '- Implemented explicit owner Voice/Identity slice: `frontend/lib/domain/identityProfiles.mjs`, `frontend/lib/application/identityApplication.mjs`, and `/voice`; explicit profile versions/context snapshots are real, but StyleMemory/NarrativeMemory/automatic identity learning are not.\n- Transfer:',
              '- Implemented explicit owner Voice/Identity slice: `frontend/lib/domain/identityProfiles.mjs`, `frontend/lib/application/identityApplication.mjs`, and `/voice`; explicit profile versions/context snapshots are real, but StyleMemory/NarrativeMemory/automatic identity learning are not.\n- Implemented owner Golden Path planning/generation/review slices: `frontend/lib/domain/contentPlanning.mjs`, `platformVariantRevisions.mjs`, `platformVariantReviews.mjs`, their application/inference adapters, and `/plan`; exact LinkedIn/X revision critics, immutable owner edits/regeneration and exact approve/reject are real, while natural-language change requests, StyleMemory, NarrativeMemory and publishing remain incomplete.\n- Transfer:',
          )
          replace(
              'AGENTS.md',
              '- browser-local manual ContentSignal intake and lifecycle at `/signals`;\n- portable browser archive/import/export;',
              '- browser-local manual ContentSignal intake and lifecycle at `/signals`;\n- browser-local manual Signal → Opportunity/angle → explicit Voice → approved NarrativeStrategy → immutable LinkedIn/X revision → evidence/authenticity review → immutable edit/regeneration → exact revision approve/reject in `/plan`;\n- portable browser archive/import/export;',
          )
          PY
      - name: Commit truth updates
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md docs/CAPABILITY_MATRIX.md
          git commit -m "docs(review): record exact Golden Path review capability"
          git push origin HEAD:feat/golden-path-review-approval
