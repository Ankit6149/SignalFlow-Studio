name: Apply review-first publishing patch

on:
  push:
    branches:
      - fix/review-first-publishing

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply review-first publishing patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-first-publishing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: node scripts/apply-review-first-publishing.mjs
      - name: Commit patched product files
        run: |
          if git diff --quiet -- frontend/app/page.js frontend/app/globals.css; then
            echo "Patch produced no changes."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/page.js frontend/app/globals.css
          git commit -m "fix(publishing): make review-first handoff explicit"
          git push origin HEAD:fix/review-first-publishing
