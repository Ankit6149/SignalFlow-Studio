name: Audit diagnostics

on:
  pull_request:
    branches: [master]
    paths:
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/audit-diagnostics.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit exact PR dependency tree
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir frontend
          cd frontend
          curl -fsSL "https://raw.githubusercontent.com/Ankit6149/SignalFlow-Studio/${SOURCE_SHA}/frontend/package.json" -o package.json
          curl -fsSL "https://raw.githubusercontent.com/Ankit6149/SignalFlow-Studio/${SOURCE_SHA}/frontend/package-lock.json" -o package-lock.json
          npm ci --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high
