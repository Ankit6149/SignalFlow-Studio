name: Refresh Next lockfile

on:
  push:
    branches:
      - fix/next-security-16-3-4

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/next-security-16-3-4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile from npm registry
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Commit exact regenerated lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: regenerate Next.js security lockfile"
          git push origin HEAD:fix/next-security-16-3-4
