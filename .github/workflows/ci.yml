name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run MCP protocol and tool tests
        working-directory: mcp
        run: npm test

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run Python tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend regression tests
        working-directory: frontend
        run: npm test
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  frontend-diagnostic:
    name: frontend-diagnostic (${{ matrix.test }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - captureRecipes.test.mjs
          - durableJobs.test.mjs
          - mediaIntelligence.test.mjs
          - githubFirstOpportunityUi.test.mjs
          - githubSourceConnectionUiIntegration.test.mjs
          - goldenPathOwnerAcceptance.test.mjs
          - landingPageRevamp.test.mjs
          - publicTruth.test.mjs
          - productionCleanup.test.mjs
          - platformReviewUi.test.mjs
          - todayWorkspaceUi.test.mjs
          - voiceIdentityIntegration.test.mjs
          - workspaceAccessibility.test.mjs
          - workspaceShellProductIntegration.test.mjs
          - workspaceShellScrollAndBrand.test.mjs
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run isolated regression file
        working-directory: frontend
        run: node --test tests/${{ matrix.test }}
