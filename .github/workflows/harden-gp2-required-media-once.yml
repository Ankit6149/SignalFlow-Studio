name: Harden GP2 required-media judgment boundary

on:
  push:
    branches:
      - feat/gp2-auto-exact-review

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gp2-auto-exact-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply required-media guards
        shell: python
        run: |
          from pathlib import Path

          def replace1(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing anchor: {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          today = "frontend/lib/application/todayDecisionApplication.mjs"
          replace1(today,
              'export function projectOwnerDecisions({',
              '''function requiredMediaPending(strategy, revision) {
            const required = (strategy?.mediaRequirements || []).some((item) => {
              const type = String(item?.type || "").trim().toLowerCase();
              return item?.required === true && !["", "none", "text_only"].includes(type);
            });
            return Boolean(required && !(revision?.mediaBindings || []).length);
          }

          export function projectOwnerDecisions({''')
          replace1(today,
              '    if (!strategy || !piece) continue;\n\n    const summary = reviewSummary(review);',
              '    if (!strategy || !piece) continue;\n    if (requiredMediaPending(strategy, revision)) continue;\n\n    const summary = reviewSummary(review);')

          route = "frontend/app/api/platform-review/route.js"
          replace1(route,
              'async function requireMediaSafeApproval(apps, platformVariantId, platformVariantRevisionId, visibleMediaInput) {',
              '''function hasRequiredNonTextMedia(strategy) {
            return Boolean((strategy?.mediaRequirements || []).some((item) => {
              const type = String(item?.type || "").trim().toLowerCase();
              return item?.required === true && !["", "none", "text_only"].includes(type);
            }));
          }

          async function requireRequiredMediaBound(apps, revision) {
            if ((revision?.mediaBindings || []).length) return;
            const strategyId = opaque(revision?.narrativeStrategyId, "narrativeStrategyId");
            const strategy = await apps.contentPlanningRepository.get(strategyId);
            if (!strategy || strategy.kind !== "NarrativeStrategy" || !hasRequiredNonTextMedia(strategy)) return;
            const error = new Error("This strategy requires media before the revision can be approved.");
            error.code = "required_media_pending";
            error.status = 409;
            throw error;
          }

          async function requireMediaSafeApproval(apps, platformVariantId, platformVariantRevisionId, visibleMediaInput) {''')
          replace1(route,
              '  const bundle = await apps.reviewApplication.getReviewBundleForRevision(platformVariantId, platformVariantRevisionId);\n  const expected = expectedVisibleMedia(bundle.revision.mediaBindings || []);',
              '  const bundle = await apps.reviewApplication.getReviewBundleForRevision(platformVariantId, platformVariantRevisionId);\n  await requireRequiredMediaBound(apps, bundle.revision);\n  const expected = expectedVisibleMedia(bundle.revision.mediaBindings || []);')

          tests = "frontend/tests/todayDecisionApplication.test.mjs"
          marker = '\ntest("application derives decisions through repository ports rather than persisting a Today store", async () => {'
          new_test = '''
          test("Today suppresses an already-reviewed text-only revision while strategy-required media is still missing", () => {
            const fixture = buildFixture();
            const strategyWithRequiredMedia = {
              ...fixture.strategy,
              mediaRequirements: [{ type: "screenshot", reason: "The claim needs visible proof.", required: true }],
            };
            const projected = projectOwnerDecisions({
              ...records(fixture),
              planningRecords: [strategyWithRequiredMedia, fixture.piece, fixture.variant, fixture.revision],
            });
            assert.equal(projected.length, 0);
          });
          '''
          replace1(tests, marker, '\n' + new_test + marker.lstrip('\n'))

          ui_test = "frontend/tests/hostedOwnerReviewUi.test.mjs"
          replace1(ui_test,
              '  assert.match(route, /deferredCount/);',
              '  assert.match(route, /deferredCount/);\n  assert.match(route, /required_media_pending/);\n  assert.match(route, /requireRequiredMediaBound/);')
      - name: Remove one-shot workflow
        run: rm .github/workflows/harden-gp2-required-media-once.yml
      - name: Run focused GP2 judgment-boundary tests
        run: node --test frontend/tests/exactReviewPreparation.test.mjs frontend/tests/hostedOwnerReviewUi.test.mjs frontend/tests/todayDecisionApplication.test.mjs
      - name: Commit hardened boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/application/todayDecisionApplication.mjs \
            frontend/app/api/platform-review/route.js \
            frontend/tests/todayDecisionApplication.test.mjs \
            frontend/tests/hostedOwnerReviewUi.test.mjs \
            .github/workflows/harden-gp2-required-media-once.yml
          git commit -m "fix: enforce required media before owner judgment"
          git push origin HEAD:feat/gp2-auto-exact-review