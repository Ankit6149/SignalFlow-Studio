name: One-time Studio stylesheet cleanup

on:
  push:
    branches:
      - fix/114-studio-ui-foundation
    paths:
      - '.github/workflows/ui-foundation-cleanup.yml'

permissions:
  contents: write

jobs:
  remove-obsolete-wizard-overrides:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: fix/114-studio-ui-foundation

      - name: Remove the obsolete appended wizard override block
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('frontend/app/app-workspace.css')
          source = css_path.read_text(encoding='utf-8')
          marker = '\n\n/* Focused three-step wizard */\n'
          if source.count(marker) != 1:
              raise SystemExit(f'Expected one focused-wizard marker, found {source.count(marker)}')
          cleaned = source.split(marker, 1)[0].rstrip() + '\n'
          css_path.write_text(cleaned, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit the cleanup
        run: |
          rm .github/workflows/ui-foundation-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/app-workspace.css .github/workflows/ui-foundation-cleanup.yml
          git commit -m "refactor(ui): remove obsolete focused wizard overrides"
          git push origin HEAD:fix/114-studio-ui-foundation
