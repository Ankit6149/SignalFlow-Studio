name: One-time Studio shell alignment

on:
  push:
    branches:
      - fix/116-studio-shell-alignment
    paths:
      - '.github/workflows/shell-alignment-migration.yml'

permissions:
  contents: write

jobs:
  migrate-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out shell branch
        uses: actions/checkout@v4
        with:
          ref: fix/116-studio-shell-alignment

      - name: Update the authoritative shell styles and add regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('frontend/app/app-workspace.css')
          source = css_path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''  --app-radius: 0.625rem;\n  --app-control: 2.875rem;\n  --app-header: 4.25rem;''',
                  '''  --app-radius: 0.625rem;\n  --app-control: 2.875rem;\n  --app-shell-max: 88rem;\n  --app-header-desktop: 4.5rem;\n  --app-header-mobile: 7.25rem;\n  --app-header: var(--app-header-desktop);''',
              ),
              (
                  '''.app-shell .app-header {\n  position: sticky;\n  z-index: 50;\n  top: 0;\n  height: var(--app-header);\n  padding-inline: max(1.5rem, calc((100vw - 76rem) / 2));\n  display: grid;\n  grid-template-columns: minmax(9rem, 1fr) auto minmax(9rem, 1fr);\n  align-items: center;\n  border: 0;\n  border-bottom: 0.0625rem solid var(--app-line);\n  background: rgba(255, 255, 255, 0.96);\n  color: var(--app-ink);\n  box-shadow: none;\n  backdrop-filter: blur(1rem);\n}''',
                  '''.app-shell .app-header {\n  position: sticky;\n  z-index: 50;\n  top: 0;\n  width: 100%;\n  height: var(--app-header);\n  min-width: 0;\n  padding-inline: max(1.25rem, calc((100vw - var(--app-shell-max)) / 2));\n  display: grid;\n  grid-template-columns: minmax(11rem, 1fr) minmax(22rem, auto) minmax(11rem, 1fr);\n  align-items: center;\n  gap: clamp(1rem, 2vw, 2rem);\n  border: 0;\n  border-bottom: 0.0625rem solid var(--app-line);\n  background: rgba(255, 255, 255, 0.96);\n  color: var(--app-ink);\n  box-shadow: 0 0.5rem 1.5rem rgba(24, 24, 20, 0.025);\n  backdrop-filter: blur(1rem);\n}''',
              ),
              (
                  '''.app-shell .brand-button {\n  justify-self: start;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  cursor: pointer;\n}''',
                  '''.app-shell .brand-button {\n  min-width: 0;\n  justify-self: start;\n  padding: 0.35rem 0.45rem 0.35rem 0;\n  border: 0;\n  border-radius: 0.45rem;\n  background: transparent;\n  cursor: pointer;\n}\n\n.app-shell .brand-button:hover {\n  background: transparent;\n}\n\n.app-shell .brand-button:focus-visible,\n.app-shell .app-nav button:focus-visible {\n  outline: 0.125rem solid var(--app-accent);\n  outline-offset: 0.1875rem;\n}''',
              ),
              (
                  '''.app-shell .app-nav {\n  display: flex;\n  align-items: center;\n  gap: 1.65rem;\n  overflow: visible;\n}\n\n.app-shell .app-nav button {\n  position: relative;\n  min-width: 0;\n  padding: 0.5rem 0;\n  border: 0;\n  border-radius: 0;\n  background: transparent;\n  color: var(--app-muted);\n  font-size: 0.8125rem;\n  font-weight: 600;\n  box-shadow: none;\n  cursor: pointer;\n}\n\n.app-shell .app-nav button::after {\n  content: "";\n  position: absolute;\n  right: 50%;\n  bottom: -1.02rem;\n  left: 50%;\n  height: 0.125rem;\n  display: block;\n  background: var(--app-accent);\n  transition: right 0.18s ease, left 0.18s ease;\n}\n\n.app-shell .app-nav button:hover,\n.app-shell .app-nav button.is-active {\n  border-color: transparent;\n  background: transparent;\n  color: var(--app-ink);\n  box-shadow: none;\n}\n\n.app-shell .app-nav button.is-active::after {\n  right: 0;\n  left: 0;\n}''',
                  '''.app-shell .app-nav {\n  min-width: 0;\n  max-width: 100%;\n  padding: 0.25rem;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 0.25rem;\n  overflow: visible;\n  border: 0.0625rem solid var(--app-line);\n  border-radius: 0.625rem;\n  background: var(--app-surface-subtle);\n}\n\n.app-shell .app-nav button {\n  position: relative;\n  min-width: 0;\n  min-height: 2.25rem;\n  padding: 0.45rem 0.8rem;\n  border: 0.0625rem solid transparent;\n  border-radius: 0.4rem;\n  background: transparent;\n  color: var(--app-muted);\n  font-size: 0.8125rem;\n  font-weight: 650;\n  white-space: nowrap;\n  box-shadow: none;\n  cursor: pointer;\n  transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;\n}\n\n.app-shell .app-nav button::after {\n  display: none;\n}\n\n.app-shell .app-nav button:hover {\n  border-color: var(--app-line);\n  background: rgba(255, 255, 255, 0.72);\n  color: var(--app-ink);\n}\n\n.app-shell .app-nav button.is-active {\n  border-color: var(--app-line-strong);\n  background: var(--app-surface);\n  color: var(--app-ink);\n  box-shadow: 0 0.2rem 0.65rem rgba(24, 24, 20, 0.06);\n}''',
              ),
              (
                  '''.app-shell .app-header__status {\n  justify-self: end;\n  display: flex;\n  align-items: center;\n  gap: 0.5rem;\n  color: var(--app-muted);\n  font-size: 0.75rem;\n}''',
                  '''.app-shell .app-header__status {\n  min-width: 0;\n  max-width: 15rem;\n  justify-self: end;\n  padding: 0.45rem 0.65rem;\n  border: 0.0625rem solid var(--app-line);\n  border-radius: 999rem;\n  display: flex;\n  align-items: center;\n  gap: 0.5rem;\n  background: var(--app-surface-subtle);\n  color: var(--app-muted);\n  font-size: 0.75rem;\n}\n\n.app-shell .app-header__status > span:last-child {\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}''',
              ),
              (
                  '''.app-shell .connection-light {\n  width: 0.4rem;\n  height: 0.4rem;\n  border-radius: 50%;\n  background: #aaa89f;\n}''',
                  '''.app-shell .connection-light {\n  width: 0.4rem;\n  height: 0.4rem;\n  flex: 0 0 auto;\n  border-radius: 50%;\n  background: #aaa89f;\n}''',
              ),
              (
                  '''@media (max-width: 52rem) {\n  .app-shell .app-header {\n    height: auto;\n    min-height: var(--app-header);\n    padding: 0.8rem 1.25rem;\n    grid-template-columns: 1fr auto;\n    row-gap: 0.65rem;\n  }\n\n  .app-shell .app-nav {\n    grid-column: 1 / -1;\n    width: 100%;\n    justify-content: space-between;\n    gap: 0.75rem;\n    overflow-x: auto;\n  }\n\n  .app-shell .app-nav button::after {\n    bottom: -0.5rem;\n  }\n\n  .app-shell .app-header__status {\n    display: none;\n  }''',
                  '''@media (max-width: 52rem) {\n  .app-shell {\n    --app-header: var(--app-header-mobile);\n  }\n\n  .app-shell .app-header {\n    height: var(--app-header);\n    min-height: var(--app-header);\n    padding: 0.65rem 1rem 0.7rem;\n    grid-template-columns: minmax(0, 1fr) auto;\n    grid-template-rows: auto auto;\n    align-content: center;\n    column-gap: 0.75rem;\n    row-gap: 0.55rem;\n  }\n\n  .app-shell .app-nav {\n    grid-column: 1 / -1;\n    width: 100%;\n    justify-content: flex-start;\n    gap: 0.2rem;\n    overflow-x: auto;\n    overscroll-behavior-inline: contain;\n    scroll-snap-type: inline proximity;\n    scrollbar-width: none;\n  }\n\n  .app-shell .app-nav::-webkit-scrollbar {\n    display: none;\n  }\n\n  .app-shell .app-nav button {\n    flex: 0 0 auto;\n    scroll-snap-align: start;\n  }\n\n  .app-shell .app-header__status {\n    display: none;\n  }''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one CSS block, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          css_path.write_text(source, encoding='utf-8')

          test_path = Path('frontend/tests/shellLayout.test.mjs')
          test_path.write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\nconst workspaceUrl = new URL("../app/app-workspace.css", import.meta.url);\n\ntest("the Studio shell shares the expanded workspace frame", async () => {\n  const css = await readFile(workspaceUrl, "utf8");\n  assert.match(css, /--app-shell-max:\\s*88rem/);\n  assert.match(css, /calc\\(\\(100vw - var\\(--app-shell-max\\)\\) \\/ 2\\)/);\n  assert.match(css, /grid-template-columns:\\s*minmax\\(11rem, 1fr\\) minmax\\(22rem, auto\\) minmax\\(11rem, 1fr\\)/);\n});\n\ntest("responsive header offsets follow the real two-row height", async () => {\n  const css = await readFile(workspaceUrl, "utf8");\n  assert.match(css, /--app-header-mobile:\\s*7\\.25rem/);\n  assert.match(css, /@media \\(max-width: 52rem\\)[\\s\\S]*--app-header:\\s*var\\(--app-header-mobile\\)/);\n  assert.match(css, /\\.app-shell \\.toast \\{[\\s\\S]*top:\\s*calc\\(var\\(--app-header\\) \\+ 1rem\\)/);\n  assert.match(css, /scroll-margin-top:\\s*calc\\(var\\(--app-header\\) \\+ 1\\.5rem\\)/);\n});\n\ntest("narrow navigation remains contained and keyboard visible", async () => {\n  const css = await readFile(workspaceUrl, "utf8");\n  assert.match(css, /\\.brand-button:focus-visible,[\\s\\S]*\\.app-nav button:focus-visible/);\n  assert.match(css, /@media \\(max-width: 52rem\\)[\\s\\S]*overflow-x:\\s*auto/);\n  assert.match(css, /scroll-snap-type:\\s*inline proximity/);\n  assert.match(css, /\\.app-header__status > span:last-child[\\s\\S]*text-overflow:\\s*ellipsis/);\n});\n''', encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit the shell migration
        run: |
          rm .github/workflows/shell-alignment-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/app-workspace.css frontend/tests/shellLayout.test.mjs .github/workflows/shell-alignment-migration.yml
          git commit -m "fix(ui): align the Studio shell with the workspace frame"
          git push origin HEAD:fix/116-studio-shell-alignment
