name: Repository reconciliation checkpoint

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/reconciliation-checkpoint.yml"

permissions:
  contents: write

jobs:
  tag:
    if: github.repository == 'Ankit6149/SignalFlow-Studio'
    runs-on: ubuntu-latest
    steps:
      - name: Create post-reconciliation tag
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = "repo-hygiene-2026-10-05";

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
              core.info(`Tag ${tag} already exists; leaving it unchanged.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });

            core.info(`Created ${tag} at ${context.sha}.`);
