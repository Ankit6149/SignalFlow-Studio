name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  rendered-ui-migration:
    if: github.head_ref == 'fix/135-137-rendered-responsive-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/135-137-rendered-responsive-ui
          fetch-depth: 0
      - name: Apply guarded rendered UI correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_rendered_ui_fix.py')
          source = path.read_text(encoding='utf-8')
          repairs = {
              '("  line-height: 1.75;", "  line-height: 1.68;", "first landing lead line height"),':
                  '("  line-height: 1.75;", "  line-height: 1.68;", "landing paragraph line height", 2),',
              '("  font-size: 0.68rem;", "  font-size: 0.75rem;", "footer link size"),':
                  '("  font-size: 0.68rem;", "  font-size: 0.75rem;", "footer text size", 2),',
              'assert.match(page, /stage === \\"source\\" \\? \\"is-step-hidden\\"/);':
                  'assert.match(page, /stage !== \\"source\\" \\? \\"is-step-hidden\\"/);',
              'assert.match(page, /stage === \\"destinations\\" \\? \\"is-step-hidden\\"/);':
                  'assert.match(page, /stage !== \\"destinations\\" \\? \\"is-step-hidden\\"/);',
          }
          for old, new in repairs.items():
              if source.count(old) != 1:
                  raise SystemExit(f'Could not repair guarded tuple: {old}')
              source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')
          PY
          python scripts/apply_rendered_ui_fix.py
      - name: Verify permanent frontend contracts
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit product-only correction
        run: |
          test ! -e scripts/apply_rendered_ui_fix.py
          grep -q "visual-audit:" .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml frontend/app/app-workspace.css frontend/app/studio-product.css frontend/components/LandingPage.module.css frontend/tests/renderedResponsiveContract.test.mjs
          git diff --cached --check
          git commit -m "fix(ui): make Landing and Studio responsive in the rendered browser"
          git push origin HEAD:fix/135-137-rendered-responsive-ui

  mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run MCP protocol and tool tests
        working-directory: mcp
        run: npm test

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run Python tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend regression tests
        working-directory: frontend
        run: npm test
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  visual-audit:
    if: github.head_ref == 'fix/135-137-rendered-responsive-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser audit dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save @playwright/test@1.54.2
          npx playwright install --with-deps chromium
      - name: Build the production frontend
        working-directory: frontend
        run: npm run build
      - name: Start the production frontend
        working-directory: frontend
        run: |
          npm run start -- -p 3000 > /tmp/signalflow-visual-audit-server.log 2>&1 &
          echo $! > /tmp/signalflow-visual-audit-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/signalflow-visual-audit-server.log
          exit 1
      - name: Capture and assert rendered Landing and Studio layouts
        working-directory: frontend
        run: node scripts/visual-audit.mjs
      - name: Upload rendered audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signalflow-rendered-responsive-audit
          path: frontend/visual-audit-output
          if-no-files-found: error
          retention-days: 7
