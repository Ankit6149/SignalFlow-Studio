name: One-time Review editor layout migration

on:
  push:
    branches:
      - fix/122-review-editor-first
    paths:
      - '.github/workflows/review-editor-layout-migration.yml'

permissions:
  contents: write

jobs:
  migrate-review-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Review branch
        uses: actions/checkout@v4
        with:
          ref: fix/122-review-editor-first

      - name: Rebuild Review layout in the authoritative workspace layer
        run: |
          python - <<'PY'
          from pathlib import Path

          workspace_path = Path('frontend/app/app-workspace.css')
          workspace = workspace_path.read_text(encoding='utf-8')
          start_marker = '/* Review */\n'
          end_marker = '/* Buttons inside the application */\n'
          if workspace.count(start_marker) != 1 or workspace.count(end_marker) != 1:
              raise SystemExit('Review section markers were not unique')

          before, remainder = workspace.split(start_marker, 1)
          _, after = remainder.split(end_marker, 1)

          review_css = r'''/* Review */
.app-shell .studio-grid--review {
  grid-template-columns: minmax(0, 1fr);
}

.app-shell .studio-grid--review .composer-panel {
  display: none;
}

.app-shell .studio-grid--review .channel-groups,
.app-shell .studio-grid--review > .output-panel > .panel-kicker {
  display: none;
}

.app-shell .studio-grid--review .output-panel {
  border-top: 0;
}

.app-shell .review-workspace {
  min-width: 0;
  margin-top: 0;
  display: grid;
  grid-template-columns: 10.75rem minmax(0, 1fr);
  grid-template-areas:
    "status status"
    "stale stale"
    "tabs nav"
    "tabs editor"
    "tabs inspector"
    "tabs actions"
    "tabs route"
    "tabs notes"
    "tabs export";
  gap: 1rem 1.5rem;
  align-items: start;
}

.app-shell .campaign-status-strip {
  grid-area: status;
  min-width: 0;
}

.app-shell .campaign-stale-banner {
  grid-area: stale;
  min-width: 0;
}

.app-shell .review-tabs {
  grid-area: tabs;
  min-width: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  overflow: visible;
}

.app-shell .review-tabs button {
  width: 100%;
  min-width: 0;
  min-height: 2.85rem;
  padding: 0.55rem 0.65rem;
  border: 0;
  border-left: 0.15rem solid transparent;
  border-radius: 0;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 0.55rem;
  text-align: left;
  background: transparent;
  color: var(--app-muted);
  font-size: 0.8125rem;
  font-weight: 650;
  box-shadow: none;
  cursor: pointer;
}

.app-shell .review-tabs button:hover {
  background: var(--app-surface-subtle);
  color: var(--app-ink);
}

.app-shell .review-tabs button.is-active {
  border-color: var(--app-accent);
  background: var(--app-accent-soft);
  color: var(--app-ink);
}

.app-shell .review-tabs button:focus-visible,
.app-shell .review-nav button:focus-visible,
.app-shell .review-actions button:focus-visible,
.app-shell .publishing-route-link:focus-visible,
.app-shell .route-note summary:focus-visible,
.app-shell .export-row button:focus-visible {
  outline: 0.125rem solid var(--app-accent);
  outline-offset: 0.1875rem;
}

.app-shell .review-tabs button > span:first-child {
  width: 1.65rem;
  height: 1.65rem;
  flex: 0 0 auto;
  border: 0.0625rem solid var(--app-line);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--app-surface);
}

.app-shell .review-nav {
  grid-area: nav;
  min-width: 0;
  display: flex;
  justify-content: space-between;
  gap: 0.75rem;
}

.app-shell .review-nav button {
  min-height: 2.35rem;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--app-muted);
  font-size: 0.75rem;
  font-weight: 750;
  cursor: pointer;
}

.app-shell .review-nav button:hover {
  color: var(--app-ink);
  text-decoration: underline;
  text-decoration-color: var(--app-accent);
  text-underline-offset: 0.2rem;
}

.app-shell .native-preview {
  grid-area: editor;
  min-width: 0;
  margin-top: 0;
  overflow: hidden;
  border: 0.0625rem solid var(--app-line);
  border-radius: var(--app-radius);
  background: var(--app-surface);
  box-shadow: none;
}

.app-shell .native-preview header {
  min-width: 0;
  padding: 1rem 1.1rem;
  border-bottom: 0.0625rem solid var(--app-line);
}

.app-shell .preview-avatar {
  width: 2.2rem;
  height: 2.2rem;
  flex: 0 0 auto;
  border: 0.0625rem solid var(--app-line);
  border-radius: 50%;
  background: var(--app-surface-subtle);
  color: var(--app-accent);
}

.app-shell .native-preview header strong {
  color: var(--app-ink);
  font-size: 0.8125rem;
}

.app-shell .native-preview header div:nth-child(2) {
  min-width: 0;
}

.app-shell .native-preview header div:nth-child(2) span,
.app-shell .connection-badge,
.app-shell .native-preview footer,
.app-shell .character-guide {
  color: var(--app-faint);
  font-size: 0.75rem;
}

.app-shell .connection-badge {
  max-width: min(13rem, 40%);
  padding: 0.3rem 0.5rem;
  border: 0.0625rem solid var(--app-line);
  border-radius: 999rem;
  overflow: hidden;
  background: var(--app-surface-subtle);
  letter-spacing: 0;
  text-overflow: ellipsis;
  text-transform: none;
  white-space: nowrap;
}

.app-shell .connection-badge--ready {
  border-color: #d4e0d6;
  background: var(--app-success-soft);
  color: var(--app-success);
}

.app-shell .native-preview textarea {
  width: 100%;
  min-height: clamp(32rem, 56vh, 48rem);
  padding: 1.5rem;
  border: 0;
  resize: vertical;
  background: var(--app-surface);
  color: var(--app-ink);
  font-size: 0.9375rem;
  line-height: 1.75;
}

.app-shell .native-preview textarea:focus-visible {
  outline: 0.125rem solid var(--app-accent);
  outline-offset: -0.125rem;
}

.app-shell .native-preview footer {
  min-width: 0;
  padding: 0.8rem 1.1rem;
  border-top: 0.0625rem solid var(--app-line);
  flex-wrap: wrap;
  gap: 0.4rem 1rem;
}

.app-shell .review-inspector {
  grid-area: inspector;
  min-width: 0;
  position: static;
  padding: 1rem;
  border: 0.0625rem solid var(--app-line);
  border-radius: 0.5rem;
  background: var(--app-surface-subtle);
}

.app-shell .review-inspector__eyebrow {
  color: var(--app-accent);
  font-size: 0.6875rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.app-shell .review-inspector h3 {
  margin: 0.5rem 0 0.85rem;
  color: var(--app-ink);
  font-family: "Playfair Display", serif;
  font-size: 1.35rem;
  font-weight: 500;
}

.app-shell .review-inspector dl {
  margin: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0;
  border-top: 0.0625rem solid var(--app-line);
  border-left: 0.0625rem solid var(--app-line);
}

.app-shell .review-inspector dl div {
  min-width: 0;
  padding: 0.7rem;
  border-right: 0.0625rem solid var(--app-line);
  border-bottom: 0.0625rem solid var(--app-line);
}

.app-shell .review-inspector dt,
.app-shell .review-inspector dd {
  margin: 0;
}

.app-shell .review-inspector dt {
  color: var(--app-faint);
  font-size: 0.6875rem;
}

.app-shell .review-inspector dd {
  margin-top: 0.25rem;
  color: var(--app-ink);
  font-size: 0.8125rem;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.app-shell .review-actions {
  grid-area: actions;
  min-width: 0;
  margin-top: 0;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) minmax(12rem, auto);
  align-items: start;
  gap: 0.5rem;
}

.app-shell .review-actions .button {
  min-height: 2.65rem;
  padding-inline: 0.95rem;
  border-radius: 0.4rem;
  font-size: 0.8125rem;
  box-shadow: none;
}

.app-shell .review-actions .save-action-group {
  min-width: 0;
  justify-self: start;
}

.app-shell .review-actions .button--dark {
  min-width: 12rem;
  margin-left: 0;
  justify-self: end;
}

.app-shell .review-action-reason {
  grid-column: 1 / -1;
  min-width: 0;
  margin: 0;
  overflow-wrap: anywhere;
}

.app-shell .review-workspace > .publishing-route-link {
  grid-area: route;
  justify-self: start;
}

.app-shell .review-workspace > .route-note {
  grid-area: notes;
}

.app-shell .review-workspace > .export-row {
  grid-area: export;
}

.app-shell .publishing-route-link {
  max-width: 100%;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  color: var(--app-muted);
  font-size: 0.75rem;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.app-shell .route-note {
  min-width: 0;
  margin-top: 0;
  border: 0.0625rem solid #e5d8bd;
  border-radius: 0.5rem;
  background: var(--app-warning-soft);
}

.app-shell .route-note summary {
  padding: 0.8rem 0.9rem;
  color: var(--app-warning);
  font-size: 0.8125rem;
  font-weight: 700;
  cursor: pointer;
  overflow-wrap: anywhere;
}

.app-shell .route-note ul {
  margin: 0;
  padding: 0 1.5rem 0.9rem 2rem;
  color: var(--app-muted);
  font-size: 0.8125rem;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.app-shell .export-row {
  min-width: 0;
  margin-top: 0;
  padding: 0.95rem;
  border: 0.0625rem solid var(--app-line);
  border-radius: 0.5rem;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 0.65rem;
  background: var(--app-surface-subtle);
}

.app-shell .export-row strong,
.app-shell .export-row span {
  display: block;
}

.app-shell .export-row strong {
  color: var(--app-ink);
  font-size: 0.8125rem;
}

.app-shell .export-row span {
  margin-top: 0.2rem;
  color: var(--app-muted);
  font-size: 0.75rem;
  overflow-wrap: anywhere;
}

.app-shell .export-row button {
  min-height: 2.35rem;
  padding: 0.5rem 0.65rem;
  border: 0.0625rem solid var(--app-line);
  border-radius: 0.4rem;
  background: var(--app-surface);
  color: var(--app-ink);
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
