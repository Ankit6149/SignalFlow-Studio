name: One-shot branch cleanup

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'chore: run one-shot branch cleanup v2' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches and verify survivors
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          preserved = {
              "master",
              "feat/refine-workspace-loader-gate-c-20260915",
              "feat/editorial-execution-layer",
          }

          def request(method, path):
              url = f"https://api.github.com{path}"
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "signalflow-one-shot-branch-cleanup",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read().decode("utf-8")
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  if error.code in (404, 409, 422):
                      return error.code, body
                  raise

          def paged(path):
              page = 1
              items = []
              separator = "&" if "?" in path else "?"
              while True:
                  status, batch = request("GET", f"{path}{separator}per_page=100&page={page}")
                  if status != 200 or not isinstance(batch, list):
                      raise RuntimeError(f"Could not read {path}: HTTP {status}")
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
                  page += 1

          branches = paged(f"/repos/{repo}/branches")
          open_pulls = paged(f"/repos/{repo}/pulls?state=open")
          open_heads = {
              str(item.get("head", {}).get("ref") or "")
              for item in open_pulls
              if item.get("head", {}).get("repo", {}).get("full_name") == repo
          }

          kept = set(preserved) | open_heads
          deleted = []
          skipped_protected = []
          failures = []

          for branch in branches:
              name = str(branch.get("name") or "")
              if not name or name in kept:
                  continue
              if branch.get("protected") is True:
                  skipped_protected.append(name)
                  continue
              encoded = urllib.parse.quote(name, safe="")
              status, body = request("DELETE", f"/repos/{repo}/git/refs/heads/{encoded}")
              if status in (204, 404):
                  deleted.append(name)
              else:
                  failures.append((name, status, str(body)[:300]))

          if failures:
              for name, status, body in failures:
                  print(f"FAILED {name}: HTTP {status} {body}", file=sys.stderr)
              raise SystemExit(1)

          remaining = paged(f"/repos/{repo}/branches")
          remaining_names = {str(item.get("name") or "") for item in remaining}
          unexpected = sorted(remaining_names - kept - set(skipped_protected))
          missing_required = sorted(preserved - remaining_names)

          print(f"Deleted {len(deleted)} stale branches")
          for name in sorted(deleted):
              print(f"deleted: {name}")
          for name in sorted(skipped_protected):
              print(f"preserved protected branch: {name}")
          for name in sorted(open_heads - preserved):
              print(f"preserved open-PR branch: {name}")
          print("Remaining branches:")
          for name in sorted(remaining_names):
              print(f"remaining: {name}")

          if missing_required:
              print(f"Required preserved branches disappeared: {missing_required}", file=sys.stderr)
              raise SystemExit(1)
          if unexpected:
              print(f"Unexpected deletable branches remain: {unexpected}", file=sys.stderr)
              raise SystemExit(1)
          PY
