name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run MCP protocol and tool tests
        working-directory: mcp
        run: npm test

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run Python tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend regression tests
        working-directory: frontend
        shell: bash
        run: |
          set +e
          failed=0
          for test_file in tests/*.test.mjs; do
            output="$(node --test "$test_file" 2>&1)"
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "$output"
              detail="$(printf '%s\n' "$output" | grep -E 'not ok|AssertionError|ERR_ASSERTION|TypeError|Error:|Expected|actual:|operator:|at ' | head -n 30 | tr '\n' ' ')"
              detail="${detail//'%'/'%25'}"
              echo "::error file=frontend/$test_file::$detail"
              failed=1
            fi
          done
          exit "$failed"
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build
