name: Refresh patched frontend lockfile

on:
  push:
    branches:
      - security/next-16-4-audit-20261011
    paths:
      - ".github/workflows/refresh-patched-frontend-lockfile.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/next-16-4-audit-20261011
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate patched production dependency lock
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install next@16.4.0 --save-exact --package-lock-only --ignore-scripts
          npm pkg set overrides.sharp=0.35.5
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --omit=dev --ignore-scripts
          npm audit --package-lock-only --omit=dev --audit-level=high
      - name: Commit dependency metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency metadata changes were required."
            exit 0
          fi
          git commit -m "security: patch frontend production dependencies"
          git push origin HEAD:security/next-16-4-audit-20261011
