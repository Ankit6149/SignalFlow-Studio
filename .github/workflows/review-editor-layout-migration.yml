.app-shell .review-publish-fields {
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 0.0625rem solid var(--app-line);
  display: grid;
  gap: 0.7rem;
}

.app-shell .review-publish-fields label {
  display: grid;
  gap: 0.35rem;
}

.app-shell .review-publish-fields label > span,
.app-shell .review-publish-fields small {
  color: var(--app-muted);
  font-size: 0.75rem;
}

