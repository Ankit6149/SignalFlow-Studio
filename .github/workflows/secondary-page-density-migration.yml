name: One-time secondary-page density migration

on:
  push:
    branches:
      - fix/124-secondary-page-density
    paths:
      - '.github/workflows/secondary-page-density-migration.yml'

permissions:
  contents: write

jobs:
  migrate-secondary-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out density branch
        uses: actions/checkout@v4
        with:
          ref: fix/124-secondary-page-density

      - name: Replace oversized secondary-page cards
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('frontend/app/app-workspace.css')
          css = css_path.read_text(encoding='utf-8')
          start_marker = '/* Secondary pages */\n'
          end_marker = '/* Desktop expansion only when the viewport truly has room. */\n'
          if css.count(start_marker) != 1 or css.count(end_marker) != 1:
              raise SystemExit('Secondary page section markers were not unique')
          before, remainder = css.split(start_marker, 1)
          _, after = remainder.split(end_marker, 1)

          secondary = r'''/* Secondary pages */
