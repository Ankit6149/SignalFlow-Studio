name: Studio professionalization pass

on:
  push:
    branches:
      - product/studio-luxury-ux

permissions:
  contents: write

jobs:
  professionalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: product/studio-luxury-ux

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply professionalization payload
        run: python scripts/studio_professionalize.py

      - name: Verify patch integrity
        run: |
          git diff --check
          test -f AGENTS.md
          test -f docs/STUDIO_UX_SYSTEM.md
          test -f docs/CONNECTOR_READINESS.md
          test -f docs/GITHUB_MCP_READ_ONLY.md
          test -f frontend/app/studio-luxury.css
          test -f frontend/lib/social/socialErrors.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Commit documentation and agent handoff
        run: |
          git config user.name "SignalFlow Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md AGENTS.md .github/copilot-instructions.md docs/STUDIO_UX_SYSTEM.md docs/CONNECTOR_READINESS.md docs/GITHUB_MCP_READ_ONLY.md
          git commit -m "docs: add product truth and agent handoff"

      - name: Commit Studio visual system
        run: |
          git add frontend/app/studio-luxury.css frontend/app/layout.js
          git commit -m "style: introduce rem-based luxury Studio system"

      - name: Commit Studio workflow redesign
        run: |
          git add frontend/app/page.js
          git commit -m "feat: redesign compose and review workspace"

      - name: Commit connector readiness hardening
        run: |
          git add frontend/.env.example frontend/lib/social/socialConfig.js frontend/lib/social/socialErrors.js frontend/lib/social/socialProviders.js frontend/app/api/social/status/route.js
          git commit -m "feat: expose connector readiness and normalize API failures"

      - name: Remove temporary automation payload
        run: |
          git rm scripts/studio_professionalize.py .github/workflows/studio-professionalize.yml
          git commit -m "chore: remove temporary professionalization runner"

      - name: Push completed branch
        run: git push origin HEAD:product/studio-luxury-ux
