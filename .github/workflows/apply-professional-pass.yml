name: Apply professional product pass

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'product/professional-polish-discovery' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: product/professional-polish-discovery
          fetch-depth: 0

      - name: Reconstruct and verify reviewed release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, tarfile

          chunks = sorted(Path('.github/payload').glob('professional-pass-*.b64'))
          if not chunks:
              raise SystemExit('No release payload chunks were found.')
          encoded = ''.join(path.read_text(encoding='utf-8') for path in chunks)
          encoded = ''.join(encoded.split())
          encoded += '=' * (-len(encoded) % 4)
          payload = base64.b64decode(encoded, validate=False)
          archive = Path('/tmp/professional-pass.tar.gz')
          archive.write_bytes(payload)
          print(f'chunks={len(chunks)} encoded_bytes={len(encoded)} archive_bytes={len(payload)} sha256={hashlib.sha256(payload).hexdigest()}')
          with gzip.open(archive, 'rb') as stream:
              stream.peek(1)
          with tarfile.open(archive, 'r:gz') as tar:
              members = tar.getmembers()
              if not members:
                  raise SystemExit('Release archive is empty.')
              print('archive members:', ', '.join(member.name for member in members[:30]))
              tar.extractall('.')
          PY
          rm -rf .github/payload
          rm -f .github/workflows/apply-professional-pass.yml

      - name: Commit release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SignalFlow Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Polish SignalFlow into a professional multi-channel product" || exit 0
          git push origin HEAD:product/professional-polish-discovery
