name: Fix GP2 route boundary once

on:
  push:
    branches:
      - feat/gp2-auto-exact-review

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gp2-auto-exact-review
          fetch-depth: 0
      - name: Patch route boundary
        shell: python
        run: |
          from pathlib import Path
          path = Path("frontend/app/api/platform-review/route.js")
          text = path.read_text()
          old_get = '''      contentPieceId,
                bundle: result.bundle,
              });'''
          if old_get not in text:
              old_get = '''      contentPieceId,
      bundle: result.bundle,
    });'''
          if old_get not in text:
              raise SystemExit("GET route anchor missing")
          new_get = old_get.replace("bundle: result.bundle", "bundle: await responseBundle(apps, contentPieceId)")
          text = text.replace(old_get, new_get, 1)

          old_generation = '''          bundle: await responseBundle(apps, contentPieceId),
                  reviewPreparation: safeReviewPreparation(reviewPreparation),'''
          if old_generation not in text:
              old_generation = '''          bundle: await responseBundle(apps, contentPieceId),
          reviewPreparation: safeReviewPreparation(reviewPreparation),'''
          if old_generation not in text:
              raise SystemExit("generate_ready route anchor missing")
          text = text.replace(old_generation, old_generation.replace("bundle: await responseBundle(apps, contentPieceId)", "bundle: result.bundle"), 1)
          path.write_text(text)
      - name: Remove helper and verify focused behavior
        run: |
          rm .github/workflows/fix-gp2-route-once.yml
          node --test frontend/tests/exactReviewPreparation.test.mjs frontend/tests/hostedOwnerReviewUi.test.mjs frontend/tests/todayDecisionApplication.test.mjs
      - name: Commit route correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/api/platform-review/route.js .github/workflows/fix-gp2-route-once.yml
          git commit -m "fix: preserve hosted review route boundaries"
          git push origin HEAD:feat/gp2-auto-exact-review