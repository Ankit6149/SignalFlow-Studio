name: Apply domain and authoritative export integration

on:
  push:
    branches:
      - domain-authoritative-exports
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-domain-authoritative-exports
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: domain-authoritative-exports
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Apply Studio vertical-slice migration
        run: node scripts/apply-domain-authoritative-exports.mjs

      - name: Validate source formatting
        run: git diff --check

      - name: Install and verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Verify MCP server
        working-directory: mcp
        run: npm test

      - name: Verify Python compatibility suite
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pytest -q

      - name: Remove temporary integration files
        run: |
          rm scripts/apply-domain-authoritative-exports.mjs
          rm .github/workflows/apply-domain-authoritative-exports.yml

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: establish domain contracts and authoritative exports"
          git push origin HEAD:domain-authoritative-exports
