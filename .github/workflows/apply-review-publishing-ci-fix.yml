name: Apply review publishing CI fix

on:
  push:
    branches:
      - fix/review-first-publishing
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-first-publishing
          fetch-depth: 0
      - name: Apply compatibility-safe review action patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/app/page.js")
          source = path.read_text()
          if "const canPublishCurrent = Boolean(" in source and "onClick={copyAndOpenCurrent}" in source:
              print("Compatibility patch already applied.")
              raise SystemExit(0)

          confirmation_marker = "  const publishConfirmation = buildPublishConfirmation({"
          approval_gate = '''  const canPublishCurrent = Boolean(
            connectorReadyForPublish &&
              activeChannelStatus.isApproved &&
              directPublishAvailability.ready,
          );
'''
          if confirmation_marker not in source:
              raise SystemExit("Could not find publish confirmation marker")
          source = source.replace(confirmation_marker, approval_gate + confirmation_marker, 1)

          old_guard = "if (!directPublishAvailability.ready) {"
          if source.count(old_guard) < 2:
              raise SystemExit("Could not find both direct publish guards")
          source = source.replace(old_guard, "if (!canPublishCurrent) {", 2)

          old_disabled = "disabled={busy || !directPublishAvailability.ready}"
          if old_disabled not in source:
              raise SystemExit("Could not find direct publish button state")
          source = source.replace(old_disabled, "disabled={busy || !canPublishCurrent}", 1)

          old_handoff = "onClick={activeMeta.openUrl ? copyAndOpenCurrent : () => copyCurrentPost()}"
          if old_handoff not in source:
              raise SystemExit("Could not find primary handoff action")
          source = source.replace(old_handoff, "onClick={copyAndOpenCurrent}", 1)

          path.write_text(source)
          PY
      - name: Commit product fix
        run: |
          if git diff --quiet -- frontend/app/page.js; then
            echo "No product commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/page.js
          git commit -m "fix(review): preserve primary handoff and approval gate"
          git push origin HEAD:fix/review-first-publishing
