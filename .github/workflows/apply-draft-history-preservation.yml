name: Apply draft history preservation

on:
  push:
    branches:
      - domain-authoritative-exports
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-draft-history-preservation
  cancel-in-progress: false

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: domain-authoritative-exports
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Apply guarded history merge
        run: node scripts/apply-draft-history-preservation.mjs

      - name: Validate and verify frontend
        run: |
          git diff --check
          cd frontend
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Verify MCP
        working-directory: mcp
        run: npm test

      - name: Verify Python compatibility suite
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pytest -q

      - name: Remove temporary files
        run: |
          rm scripts/apply-draft-history-preservation.mjs
          rm .github/workflows/apply-draft-history-preservation.yml

      - name: Commit verified history behavior
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve generated history across campaign re-saves"
          git push origin HEAD:domain-authoritative-exports
