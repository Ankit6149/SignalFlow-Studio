name: Final Studio connector safeguards

on:
  push:
    branches:
      - product/studio-luxury-ux

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: product/studio-luxury-ux

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply final safeguards
        run: python scripts/studio_connector_finish.py

      - name: Verify patch integrity
        run: git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Commit publishing safeguards
        run: |
          git config user.name "SignalFlow Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/app/page.js frontend/app/studio-luxury.css frontend/lib/social/socialConfig.js frontend/lib/social/socialProviders.js frontend/.env.example
          git commit -m "fix: align Studio validation with live publishing"

      - name: Commit current connector prerequisites
        run: |
          git add docs/CONNECTOR_READINESS.md
          git commit -m "docs: record current platform access requirements"

      - name: Remove temporary automation payload
        run: |
          git rm scripts/studio_connector_finish.py .github/workflows/studio-connector-finish.yml
          git commit -m "chore: remove final safeguard runner"

      - name: Push completed branch
        run: git push origin HEAD:product/studio-luxury-ux
