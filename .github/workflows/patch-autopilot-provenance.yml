name: Patch autopilot provenance contracts

on:
  push:
    branches:
      - feat/golden-path-autopilot

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/golden-path-autopilot
      - name: Apply checked-in patch script
        run: python scripts/patch_autopilot_provenance.py
      - name: Commit provenance contracts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/lib/domain/contentOpportunities.mjs frontend/lib/domain/contentPlanning.mjs frontend/lib/application/contentPlanningApplication.mjs
          git commit -m "feat: record autopilot editorial decision provenance"
          git push origin HEAD:feat/golden-path-autopilot
