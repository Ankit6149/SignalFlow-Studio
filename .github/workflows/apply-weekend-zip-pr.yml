name: Apply weekend ZIP integration on PR

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'fix/weekend-complete-zip-export'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weekend-complete-zip-export
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply guarded product migration
        run: python scripts/apply_weekend_zip_ui.py

      - name: Verify the complete frontend contract
        id: frontend-contract
        working-directory: frontend
        shell: bash
        run: |
          set +e

          npm ci 2>&1 | tee /tmp/zip-npm-ci.log
          ci_status=${PIPESTATUS[0]}
          if [ "$ci_status" -ne 0 ]; then
            echo "failed_stage=npm-ci" >> "$GITHUB_OUTPUT"
            exit "$ci_status"
          fi

          npm test 2>&1 | tee /tmp/zip-npm-test.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            echo "failed_stage=npm-test" >> "$GITHUB_OUTPUT"
            exit "$test_status"
          fi

          npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/zip-npm-audit.log
          audit_status=${PIPESTATUS[0]}
          if [ "$audit_status" -ne 0 ]; then
            echo "failed_stage=npm-audit" >> "$GITHUB_OUTPUT"
            exit "$audit_status"
          fi

          npm run build 2>&1 | tee /tmp/zip-next-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            echo "failed_stage=next-build" >> "$GITHUB_OUTPUT"
            exit "$build_status"
          fi

          set -e
          echo "failed_stage=none" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekend-zip-integration-diagnostics
          path: |
            /tmp/zip-npm-ci.log
            /tmp/zip-npm-test.log
            /tmp/zip-npm-audit.log
            /tmp/zip-next-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Commit only permanent product files
        run: |
          test ! -e scripts/apply_weekend_zip_ui.py
          test ! -e .github/workflows/apply-weekend-zip-ui.yml
          test ! -e .github/workflows/apply-weekend-zip-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No permanent product changes were produced"; exit 1; }
          git commit -m "feat(export): complete ZIP export across save, reopen, and Review"
          git push origin HEAD:fix/weekend-complete-zip-export
