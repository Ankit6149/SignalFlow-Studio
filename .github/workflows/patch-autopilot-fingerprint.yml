name: Patch autopilot opportunity fingerprint

on:
  push:
    branches:
      - feat/golden-path-autopilot

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/golden-path-autopilot
      - name: Remove workflow timestamp from editorial fingerprint
        run: python -c "from pathlib import Path; p=Path('frontend/lib/domain/contentOpportunities.mjs'); s=p.read_text(); old='    updatedAt: signal.updatedAt,\\n'; assert old in s, 'fingerprint timestamp line missing'; p.write_text(s.replace(old, '', 1))"
      - name: Commit fingerprint fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/lib/domain/contentOpportunities.mjs
          git commit -m "fix: keep opportunity cache stable across workflow status changes"
          git push origin HEAD:feat/golden-path-autopilot
