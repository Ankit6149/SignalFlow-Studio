name: Apply public product reliability fixes

# Registered on the audit branch; this push starts the one-time source migration.
on:
  push:
    branches: [audit/public-product-reliability]
    paths:
      - .github/scripts/apply-public-audit-fixes.mjs
      - .github/workflows/apply-public-audit-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/public-product-reliability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply audited fixes
        run: node .github/scripts/apply-public-audit-fixes.mjs
      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden public product reliability and security"
          git push origin HEAD:audit/public-product-reliability
