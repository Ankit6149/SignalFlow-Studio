name: Patch autopilot capability truth

on:
  push:
    branches:
      - feat/golden-path-autopilot

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/golden-path-autopilot
      - name: Apply capability truth patch
        run: python scripts/patch_autopilot_capability_truth.py
      - name: Commit capability truth
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CAPABILITY_MATRIX.md
          git commit -m "docs: record explicit Golden Path autopilot capability"
          git push origin HEAD:feat/golden-path-autopilot
