name: Apply UI containment

on:
  push:
    branches:
      - fix/layout-containment-and-scrollbars

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/layout-containment-and-scrollbars
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load final containment stylesheet last
        run: |
          python - <<'PY'
          from pathlib import Path

          layout = Path('frontend/app/layout.js')
          text = layout.read_text(encoding='utf-8')
          anchor = 'import "../app/app-workspace.css";\n'
          addition = 'import "../app/ui-containment.css";\n'

          if addition not in text:
              if anchor not in text:
                  raise SystemExit('Could not find app-workspace import anchor')
              text = text.replace(anchor, anchor + addition, 1)
              layout.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-ui-containment.yml

      - name: Commit generated source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/layout.js .github/workflows/apply-ui-containment.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: load layout containment after visual layers"
          git push origin HEAD:fix/layout-containment-and-scrollbars
