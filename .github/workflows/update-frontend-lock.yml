name: Update frontend lockfile

on:
  push:
    branches:
      - recovery/security-runtime
    paths:
      - frontend/package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/security-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate package lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package lock
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: lock patched PostCSS and Sharp versions"
          git push origin HEAD:recovery/security-runtime
