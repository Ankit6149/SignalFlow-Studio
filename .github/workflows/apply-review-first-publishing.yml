name: Apply review-first publishing patch

on:
  push:
    branches:
      - fix/review-first-publishing
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-first-publishing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: |
          if grep -q "selectDirectPublishAvailability" frontend/app/page.js; then
            echo "Review-first publishing patch is already applied."
          else
            node scripts/apply-review-first-publishing.mjs
          fi
      - name: Commit patched product files
        run: |
          if git diff --quiet -- frontend/app/page.js frontend/app/globals.css; then
            echo "No product patch commit is required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/page.js frontend/app/globals.css
          git commit -m "fix(publishing): make review-first handoff explicit"
          git push origin HEAD:fix/review-first-publishing
