name: One-time Source stage layout migration

on:
  push:
    branches:
      - fix/118-source-stage-layout
    paths:
      - '.github/workflows/source-stage-layout-migration.yml'

permissions:
  contents: write

jobs:
  migrate-source-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Source branch
        uses: actions/checkout@v4
        with:
          ref: fix/118-source-stage-layout

      - name: Replace implicit Source placement with named areas
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('frontend/app/studio-product.css')
          source = css_path.read_text(encoding='utf-8')

          old_source = '''.app-shell .studio-page[data-stage="source"] .composer-panel {\n  display: grid;\n  grid-template-columns: minmax(0, 1.18fr) minmax(21rem, 0.82fr);\n  column-gap: clamp(2rem, 4vw, 4.25rem);\n  row-gap: 0;\n  align-items: start;\n}\n\n.app-shell .studio-page[data-stage="source"] .composer-panel > .panel-kicker {\n  grid-column: 1 / -1;\n}\n\n.app-shell .studio-page[data-stage="source"] .composer-panel > .field:not(.field--large) {\n  grid-column: 1;\n}\n\n.app-shell .studio-page[data-stage="source"] .composer-panel > .field--large {\n  grid-column: 1;\n}\n\n.app-shell .studio-page[data-stage="source"] .field--large textarea {\n  min-height: clamp(18rem, 34vh, 25rem);\n}\n\n.app-shell .studio-page[data-stage="source"] .source-grid {\n  grid-column: 2;\n  grid-row: 2 / span 2;\n  grid-template-columns: minmax(0, 1fr);\n  align-content: start;\n  gap: 0;\n  padding: 1.25rem;\n  border: 0.0625rem solid var(--app-line);\n  border-radius: 0.75rem;\n  background: var(--app-surface-subtle);\n}\n\n.app-shell .studio-page[data-stage="source"] .source-grid::before {\n  content: "Supporting evidence";\n  margin-bottom: 1rem;\n  color: var(--app-accent);\n  font-size: 0.6875rem;\n  font-weight: 750;\n  letter-spacing: 0.11em;\n  text-transform: uppercase;\n}\n\n.app-shell .studio-page[data-stage="source"] .source-grid .field:last-child {\n  margin-bottom: 0;\n}\n\n.app-shell .studio-page[data-stage="source"] .upload-zone,\n.app-shell .studio-page[data-stage="source"] .file-list {\n  grid-column: 2;\n}\n\n.app-shell .studio-page[data-stage="source"] .upload-zone {\n  min-height: 7.5rem;\n  margin-top: 1rem;\n  padding: 1.25rem;\n  border-radius: 0.75rem;\n  background: var(--app-surface-subtle);\n}\n\n.app-shell .studio-page[data-stage="source"] .upload-zone__icon {\n  background: var(--app-accent-soft);\n  color: var(--app-accent);\n}\n'''

          new_source = '''.app-shell .studio-page[data-stage="source"] .composer-panel {\n  display: grid;\n  grid-template-columns: minmax(32rem, 1.25fr) minmax(20rem, 0.75fr);\n  grid-template-areas:\n    "header header"\n    "identity evidence"\n    "brief evidence"\n    "brief upload"\n    "brief files";\n  column-gap: clamp(2rem, 4vw, 4.25rem);\n  row-gap: 0.9rem;\n  align-items: start;\n}\n\n.app-shell .studio-page[data-stage="source"] .composer-panel > .panel-kicker {\n  grid-area: header;\n  margin-bottom: 0.85rem;\n}\n\n.app-shell .studio-page[data-stage="source"] .composer-panel > .field:not(.field--large) {\n  grid-area: identity;\n  min-width: 0;\n  margin-bottom: 0;\n}\n\n.app-shell .studio-page[data-stage="source"] .composer-panel > .field--large {\n  grid-area: brief;\n  min-width: 0;\n  min-height: 100%;\n  margin-bottom: 0;\n  display: grid;\n  grid-template-rows: auto minmax(20rem, 1fr) auto;\n}\n\n.app-shell .studio-page[data-stage="source"] .field--large textarea {\n  height: 100%;\n  min-height: clamp(20rem, 38vh, 29rem);\n}\n\n.app-shell .studio-page[data-stage="source"] .source-grid {\n  grid-area: evidence;\n  min-width: 0;\n  grid-template-columns: minmax(0, 1fr);\n  align-content: start;\n  gap: 0.9rem;\n  padding: 1.25rem;\n  border: 0.0625rem solid var(--app-line);\n  border-radius: 0.75rem;\n  background: var(--app-surface-subtle);\n}\n\n.app-shell .studio-page[data-stage="source"] .source-grid::before {\n  content: "Supporting evidence";\n  margin-bottom: 0.1rem;\n  color: var(--app-accent);\n  font-size: 0.6875rem;\n  font-weight: 750;\n  letter-spacing: 0.11em;\n  text-transform: uppercase;\n}\n\n.app-shell .studio-page[data-stage="source"] .source-grid .field {\n  min-width: 0;\n  margin-bottom: 0;\n}\n\n.app-shell .studio-page[data-stage="source"] .source-grid input,\n.app-shell .studio-page[data-stage="source"] .source-grid textarea {\n  min-width: 0;\n}\n\n.app-shell .studio-page[data-stage="source"] .upload-zone {\n  grid-area: upload;\n  min-width: 0;\n  min-height: 7rem;\n  margin-top: 0;\n  padding: 1.1rem 1.25rem;\n  border-radius: 0.75rem;\n  background: var(--app-surface-subtle);\n}\n\n.app-shell .studio-page[data-stage="source"] .upload-zone:focus-visible {\n  outline: 0.125rem solid var(--app-accent);\n  outline-offset: 0.1875rem;\n}\n\n.app-shell .studio-page[data-stage="source"] .upload-zone__icon {\n  background: var(--app-accent-soft);\n  color: var(--app-accent);\n}\n\n.app-shell .studio-page[data-stage="source"] .file-list {\n  grid-area: files;\n  min-width: 0;\n  margin-top: 0;\n  display: grid;\n  grid-template-columns: minmax(0, 1fr);\n  gap: 0.5rem;\n}\n\n.app-shell .studio-page[data-stage="source"] .file-chip {\n  width: 100%;\n  min-width: 0;\n  padding: 0.55rem 0.65rem 0.55rem 0.8rem;\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) auto auto;\n  align-items: center;\n}\n\n.app-shell .studio-page[data-stage="source"] .file-chip span {\n  min-width: 0;\n  max-width: none;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.app-shell .studio-page[data-stage="source"] .file-chip small {\n  white-space: nowrap;\n}\n\n.app-shell .studio-page[data-stage="source"] .file-chip button {\n  width: 2rem;\n  height: 2rem;\n  border-radius: 0.35rem;\n  display: grid;\n  place-items: center;\n}\n\n.app-shell .studio-page[data-stage="source"] .file-chip button:hover {\n  background: var(--app-accent-soft);\n  color: var(--app-danger);\n}\n\n.app-shell .studio-page[data-stage="source"] .file-chip button:focus-visible {\n  outline: 0.125rem solid var(--app-accent);\n  outline-offset: 0.125rem;\n}\n'''

          if source.count(old_source) != 1:
              raise SystemExit(f'Expected one original Source layout block, found {source.count(old_source)}')
          source = source.replace(old_source, new_source, 1)

          old_responsive = '''  .app-shell .studio-page[data-stage="source"] .composer-panel,\n  .app-shell .studio-page[data-stage="destinations"] .output-panel {\n    grid-template-columns: minmax(0, 1fr);\n  }\n\n  .app-shell .studio-page[data-stage="source"] .composer-panel > *,\n  .app-shell .studio-page[data-stage="destinations"] .output-panel > * {\n    grid-column: 1;\n    grid-row: auto;\n  }'''

          new_responsive = '''  .app-shell .studio-page[data-stage="source"] .composer-panel {\n    grid-template-columns: minmax(0, 1fr);\n    grid-template-areas:\n      "header"\n      "identity"\n      "brief"\n      "evidence"\n      "upload"\n      "files";\n    row-gap: 1rem;\n  }\n\n  .app-shell .studio-page[data-stage="destinations"] .output-panel {\n    grid-template-columns: minmax(0, 1fr);\n  }\n\n  .app-shell .studio-page[data-stage="destinations"] .output-panel > * {\n    grid-column: 1;\n    grid-row: auto;\n  }'''

          if source.count(old_responsive) != 1:
              raise SystemExit(f'Expected one responsive layout block, found {source.count(old_responsive)}')
          source = source.replace(old_responsive, new_responsive, 1)
          css_path.write_text(source, encoding='utf-8')

          test_path = Path('frontend/tests/sourceStageLayout.test.mjs')
          test_path.write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\nconst workflowUrl = new URL("../app/studio-product.css", import.meta.url);\n\ntest("Source uses explicit desktop and mobile reading areas", async () => {\n  const css = await readFile(workflowUrl, "utf8");\n  assert.match(css, /grid-template-areas:[\\s\\S]*"header header"[\\s\\S]*"identity evidence"[\\s\\S]*"brief evidence"[\\s\\S]*"brief upload"[\\s\\S]*"brief files"/);\n  assert.match(css, /@media \\(max-width: 68rem\\)[\\s\\S]*grid-template-areas:[\\s\\S]*"header"[\\s\\S]*"identity"[\\s\\S]*"brief"[\\s\\S]*"evidence"[\\s\\S]*"upload"[\\s\\S]*"files"/);\n  assert.doesNotMatch(css, /grid-row:\\s*2 \\/ span 2/);\n});\n\ntest("Source evidence and attached files remain width safe", async () => {\n  const css = await readFile(workflowUrl, "utf8");\n  assert.match(css, /\\.source-grid \\{[\\s\\S]*min-width:\\s*0/);\n  assert.match(css, /\\.file-list \\{[\\s\\S]*display:\\s*grid/);\n  assert.match(css, /\\.file-chip \\{[\\s\\S]*grid-template-columns:\\s*minmax\\(0, 1fr\\) auto auto/);\n  assert.match(css, /\\.file-chip span \\{[\\s\\S]*text-overflow:\\s*ellipsis/);\n  assert.doesNotMatch(css, /\\.studio-page\\[data-stage="source"\\][\\s\\S]*overflow-y:\\s*(auto|scroll)/);\n});\n\ntest("Source upload and remove controls expose visible keyboard focus", async () => {\n  const css = await readFile(workflowUrl, "utf8");\n  assert.match(css, /\\.upload-zone:focus-visible/);\n  assert.match(css, /\\.file-chip button:focus-visible/);\n});\n''', encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit Source layout
        run: |
          rm .github/workflows/source-stage-layout-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/studio-product.css frontend/tests/sourceStageLayout.test.mjs .github/workflows/source-stage-layout-migration.yml
          git commit -m "fix(ui): make the Source stage explicit and stress-safe"
          git push origin HEAD:fix/118-source-stage-layout
