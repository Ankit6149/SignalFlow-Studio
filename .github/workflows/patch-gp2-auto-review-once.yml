name: Patch GP2 automatic review client recovery

on:
  push:
    branches:
      - feat/gp2-auto-exact-review

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gp2-auto-exact-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact review recovery patch
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing: {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          route = "frontend/app/api/platform-review/route.js"
          replace(route,
          '''function safeReviewPreparation(result) {
            return {
              reviewedCount: Array.isArray(result?.reviewed) ? result.reviewed.length : 0,
              skippedCount: Array.isArray(result?.skipped) ? result.skipped.length : 0,
              failed: Array.isArray(result?.failed)
          ''',
          '''function safeReviewPreparation(result) {
            const skipped = Array.isArray(result?.skipped) ? result.skipped : [];
            return {
              reviewedCount: Array.isArray(result?.reviewed) ? result.reviewed.length : 0,
              skippedCount: skipped.length,
              deferredCount: skipped.filter((item) => item.reason === "required_media_pending").length,
              failed: Array.isArray(result?.failed)
          ''')
          replace(route, 'bundle: await responseBundle(apps, contentPieceId),', 'bundle: result.bundle,')

          client = "frontend/lib/infrastructure/browserHostedPlatformReviewClient.mjs"
          replace(client,
          '''function normalizeScreenshotResult(input = {}) {
          ''',
          '''function normalizeAutoReview(input = null) {
            if (!input) return null;
            return Object.freeze({
              status: input.status ? String(input.status) : null,
              platformVariantReviewId: input.platformVariantReviewId ? String(input.platformVariantReviewId) : null,
              failureCode: input.failureCode ? String(input.failureCode) : null,
            });
          }

          function normalizeReviewPreparation(input = null) {
            if (!input) return null;
            return Object.freeze({
              reviewedCount: Number.isInteger(input.reviewedCount) ? input.reviewedCount : 0,
              skippedCount: Number.isInteger(input.skippedCount) ? input.skippedCount : 0,
              deferredCount: Number.isInteger(input.deferredCount) ? input.deferredCount : 0,
              failed: Array.isArray(input.failed) ? input.failed.map((item) => Object.freeze({
                platformVariantId: item?.platformVariantId ? String(item.platformVariantId) : null,
                platformVariantRevisionId: item?.platformVariantRevisionId ? String(item.platformVariantRevisionId) : null,
                destination: item?.destination ? String(item.destination) : null,
                code: item?.code ? String(item.code) : "platform_review_failed",
              })) : [],
            });
          }

          function normalizeScreenshotResult(input = {}) {
          ''')
          replace(client,
          '''    derivative: input.derivative ? Object.freeze({ ...input.derivative }) : null,
            });
          }
          ''',
          '''    derivative: input.derivative ? Object.freeze({ ...input.derivative }) : null,
              autoReview: normalizeAutoReview(input.autoReview),
            });
          }
          ''')
          replace(client,
          '''      bundle: normalizeBundle(data.result?.bundle || {}),
            });
          }
          ''',
          '''      bundle: normalizeBundle(data.result?.bundle || {}),
              reviewPreparation: normalizeReviewPreparation(data.result?.reviewPreparation),
            });
          }
          ''')

          drafts = "frontend/components/HostedPlatformDraftsPanel.js"
          replace(drafts,
          '''function screenshotMessage(result, destination) {
            const label = destinationLabel(destination);
            if (result.status === "bound") return { type: "success", text: `${label} now has a new immutable revision with the exact automatic screenshot derivative bound for review.` };
          ''',
          '''function screenshotMessage(result, destination) {
            const label = destinationLabel(destination);
            if (result.status === "bound" && result.autoReview?.status === "reviewed") return { type: "success", text: `${label} now has the exact screenshot derivative bound and automatic exact checks complete. The revision is ready in Today.` };
            if (result.status === "bound" && result.autoReview?.status === "already_reviewed") return { type: "success", text: `${label} now has the exact screenshot derivative bound and its current exact review is already available in Today.` };
            if (result.status === "bound" && result.autoReview?.status === "review_failed") return { type: "warning", text: `${label} now has the exact screenshot derivative bound, but automatic exact checks need a retry before owner judgment.` };
            if (result.status === "bound" && result.autoReview?.status === "deferred_required_media") return { type: "warning", text: `${label} media was bound, but another required media dependency still prevents exact review.` };
            if (result.status === "bound") return { type: "success", text: `${label} now has a new immutable revision with the exact automatic screenshot derivative bound for review.` };
          ''')
          replace(drafts,
          '''      if (result.failed.length && result.generated.length) {
                setMessage({
                  type: "warning",
                  text: `${result.generated.length} hosted draft${result.generated.length === 1 ? "" : "s"} generated. ${result.failed.map((item) => destinationLabel(item.destination)).join(", ")} failed without invalidating the successful revision.`,
                });
              } else if (result.failed.length) {
                setMessage({ type: "error", text: result.failed.map((item) => `${destinationLabel(item.destination)}: ${item.message}`).join(" ") });
              } else if (result.generated.length) {
                setMessage({ type: "success", text: "Hosted platform drafts are now durable immutable revisions. Review each exact revision independently." });
              } else {
                setMessage({ type: "success", text: "Every non-omitted hosted destination already has a current durable revision." });
              }
          ''',
          '''      const reviewPreparation = result.reviewPreparation;
              const reviewFailures = reviewPreparation?.failed || [];
              if (result.failed.length && result.generated.length) {
                setMessage({
                  type: "warning",
                  text: `${result.generated.length} hosted draft${result.generated.length === 1 ? "" : "s"} generated. ${result.failed.map((item) => destinationLabel(item.destination)).join(", ")} failed without invalidating the successful revision.`,
                });
              } else if (result.failed.length) {
                setMessage({ type: "error", text: result.failed.map((item) => `${destinationLabel(item.destination)}: ${item.message}`).join(" ") });
              } else if (reviewFailures.length) {
                setMessage({ type: "warning", text: `Hosted drafts are durable, but ${reviewFailures.length} automatic exact review${reviewFailures.length === 1 ? "" : "s"} need recovery before owner judgment.` });
              } else if (reviewPreparation?.deferredCount) {
                setMessage({ type: "success", text: "Hosted drafts are durable. Required visual proof will be bound before SignalFlow runs the final exact checks." });
              } else if (reviewPreparation?.reviewedCount || result.generated.length) {
                setMessage({ type: "success", text: "Hosted drafts are durable and automatic exact checks are complete. Reviewed revisions are ready in Today." });
              } else {
                setMessage({ type: "success", text: "Every non-omitted hosted destination already has a current durable revision and exact review is up to date." });
              }
          ''')
          replace(drafts,
          '''            const needsScreenshot = Boolean(requiredScreenshot && currentRevision && !currentRevision.mediaBindings?.length);
          ''',
          '''            const needsScreenshot = Boolean(requiredScreenshot && currentRevision && !currentRevision.mediaBindings?.length);
                const requiredMediaPending = Boolean(requiredScreenshot?.required === true && needsScreenshot);
          ''')
          replace(drafts,
          '''                    <HostedPlatformRevisionReviewPanel entry={entry} client={client} onChanged={reload} />
          ''',
          '''                    <HostedPlatformRevisionReviewPanel entry={entry} client={client} onChanged={reload} requiredMediaPending={requiredMediaPending} />
          ''')
          replace(drafts,
          '''<div className={styles.subhead}><span>CONNECTED-SOURCE REVIEW · EXACT REVISIONS</span><p>Every judgment is pinned to the visible immutable revision. Media-bound approvals additionally require a signed proof that every exact private AssetVersion was actually rendered.</p></div>
          ''',
          '''<div className={styles.subhead}><span>CONNECTED-SOURCE REVIEW · EXACT REVISIONS</span><p>SignalFlow runs exact evidence/authenticity checks automatically when the revision is judgment-ready. Required media is bound first; manual checks remain only as recovery.</p></div>
          ''')

          panel = "frontend/components/HostedPlatformRevisionReviewPanel.js"
          replace(panel,
          '''export default function HostedPlatformRevisionReviewPanel({ entry, client, onChanged }) {
          ''',
          '''export default function HostedPlatformRevisionReviewPanel({ entry, client, onChanged, requiredMediaPending = false }) {
          ''')
          replace(panel,
          '''  const mediaApprovalBlocked = Boolean(revision.mediaBindings?.length && (
              !previewBelongsToRevision
              || !mediaPreviewState.ready
              || mediaPreviewState.visibleMedia?.length !== revision.mediaBindings.length
            ));
          ''',
          '''  const mediaApprovalBlocked = Boolean(requiredMediaPending || (revision.mediaBindings?.length && (
              !previewBelongsToRevision
              || !mediaPreviewState.ready
              || mediaPreviewState.visibleMedia?.length !== revision.mediaBindings.length
            )));
          ''')
          replace(panel,
          '''      {!review ? (
                <div className={styles.reviewGate}>
                  <div><span>HOSTED QUALITY GATE</span><p>Run evidence and authenticity checks on immutable revision {revision.revisionNumber} before approval.</p></div>
                  <button type="button" onClick={runChecks} disabled={Boolean(busy)}>{busy === "review" ? "Checking…" : "Run exact checks"}</button>
                </div>
              ) : (
          ''',
          '''      {requiredMediaPending && (
                <div className={styles.reviewGate}>
                  <div><span>REQUIRED MEDIA · PREPARING</span><p>SignalFlow will run the final exact evidence/authenticity checks automatically after the required visual proof is bound to this revision.</p></div>
                </div>
              )}

              {!review ? (
                requiredMediaPending ? null : (
                  <div className={styles.reviewGate}>
                    <div><span>EXACT CHECK RECOVERY</span><p>Automatic exact checks did not complete for immutable revision {revision.revisionNumber}. Retry them without changing the revision.</p></div>
                    <button type="button" onClick={runChecks} disabled={Boolean(busy)}>{busy === "review" ? "Checking…" : "Retry exact checks"}</button>
                  </div>
                )
              ) : (
          ''')

          test_path = "frontend/tests/hostedOwnerReviewUi.test.mjs"
          replace(test_path,
          '''  assert.match(route, /safeAssetIdentity/);
            assert.doesNotMatch(route, /presign|signedUrl|objectKey|storageRef/);
          ''',
          '''  assert.match(route, /safeAssetIdentity/);
            assert.match(route, /preparationReviewApplication\.ensureContentPieceReviewed/);
            assert.match(route, /automaticallyReviewRevision/);
            assert.match(route, /result\.status === "bound" && result\.boundRevision/);
            assert.match(route, /deferredCount/);
            assert.doesNotMatch(route, /presign|signedUrl|objectKey|storageRef/);
          ''')
          replace(test_path,
          '''  assert.match(drafts, /HostedPlatformRevisionReviewPanel/);
            assert.doesNotMatch(drafts, /localStorage|createBrowserPlatformReviewApplication|createBrowserPlatformGenerationApplication/);
          ''',
          '''  assert.match(drafts, /HostedPlatformRevisionReviewPanel/);
            assert.match(drafts, /reviewPreparation/);
            assert.match(drafts, /result\.autoReview\?\.status/);
            assert.match(drafts, /requiredMediaPending/);
            assert.doesNotMatch(drafts, /localStorage|createBrowserPlatformReviewApplication|createBrowserPlatformGenerationApplication/);
          ''')
          replace(test_path,
          '''  assert.match(revision, /restoreRevision/);
            assert.doesNotMatch(revision, /localStorage|createBrowserPlatformReviewApplication/);
          ''',
          '''  assert.match(revision, /restoreRevision/);
            assert.match(revision, /requiredMediaPending/);
            assert.match(revision, /Retry exact checks/);
            assert.match(revision, /mediaApprovalBlocked = Boolean\(requiredMediaPending/);
            assert.doesNotMatch(revision, /localStorage|createBrowserPlatformReviewApplication/);
          ''')
          replace(test_path,
          '''  assert.match(client, /action: "produce_screenshot"/);
          ''',
          '''  assert.match(client, /action: "produce_screenshot"/);
            assert.match(client, /normalizeReviewPreparation/);
            assert.match(client, /autoReview: normalizeAutoReview/);
          ''')
      - name: Remove one-shot workflow
        run: rm .github/workflows/patch-gp2-auto-review-once.yml
      - name: Run focused automatic review tests
        run: node --test frontend/tests/exactReviewPreparation.test.mjs frontend/tests/hostedOwnerReviewUi.test.mjs
      - name: Commit patched branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/api/platform-review/route.js \
            frontend/lib/infrastructure/browserHostedPlatformReviewClient.mjs \
            frontend/components/HostedPlatformDraftsPanel.js \
            frontend/components/HostedPlatformRevisionReviewPanel.js \
            frontend/tests/hostedOwnerReviewUi.test.mjs \
            .github/workflows/patch-gp2-auto-review-once.yml
          git commit -m "feat: surface automatic exact review recovery"
          git push origin HEAD:feat/gp2-auto-exact-review
