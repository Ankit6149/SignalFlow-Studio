name: Apply portable transfer product integration

on:
  push:
    branches:
      - architecture/portable-transfer
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-portable-transfer-product
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/portable-transfer
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate and apply product integration
        run: |
          python -m py_compile scripts/apply-portable-transfer-product.py
          python scripts/apply-portable-transfer-product.py
          git diff --check

      - name: Verify frontend contracts security and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Verify MCP server
        working-directory: mcp
        run: npm test

      - name: Verify Python compatibility suite
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pytest -q

      - name: Remove temporary integration files
        run: |
          rm scripts/apply-portable-transfer-product.py
          rm .github/workflows/apply-portable-transfer-product.yml
          rm -rf scripts/__pycache__

      - name: Commit verified product integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete portable transfer product workflow"
          git push origin HEAD:architecture/portable-transfer
