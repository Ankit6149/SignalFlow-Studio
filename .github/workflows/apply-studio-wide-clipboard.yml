name: Apply Studio wide clipboard patch

on:
  push:
    branches:
      - fix/studio-wide-layout-clipboard-images

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/studio-wide-layout-clipboard-images
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply product patch
        run: |
          if grep -q 'handleSourcePaste' frontend/app/page.js && grep -q 'Wide Studio workspace and clipboard source contract' frontend/app/responsive-studio.css; then
            echo 'Product patch is already applied.'
          else
            node scripts/apply-studio-wide-clipboard.mjs
          fi
      - name: Commit product files
        run: |
          if git diff --quiet -- frontend/app/page.js frontend/app/responsive-studio.css; then
            echo 'No product commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app/page.js frontend/app/responsive-studio.css
          git commit -m 'fix(studio): use wide workspace and accept pasted images'
          git push origin HEAD:fix/studio-wide-layout-clipboard-images
