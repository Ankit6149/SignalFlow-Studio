name: Trigger secondary-page density migration

on:
  push:
    branches:
      - fix/124-secondary-page-density
    paths:
      - '.github/workflows/secondary-page-density-trigger.yml'

permissions:
  contents: write

jobs:
  run-reviewed-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out density branch
        uses: actions/checkout@v4
        with:
          ref: fix/124-secondary-page-density

      - name: Extract and run the reviewed Python migration
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/secondary-page-density-migration.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "          PY\n\n      - name: Remove temporary workflow"
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('Could not locate the reviewed migration script exactly once')
          body = workflow.split(start, 1)[1].split(end, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          script = '\n'.join(lines) + '\n'
          compile(script, '/tmp/secondary-page-density.py', 'exec')
          exec(script, {'__name__': '__main__'})
          PY

      - name: Remove temporary workflows and commit density changes
        run: |
          rm .github/workflows/secondary-page-density-migration.yml
          rm .github/workflows/secondary-page-density-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/app-workspace.css frontend/tests/secondaryPageDensity.test.mjs .github/workflows/secondary-page-density-migration.yml .github/workflows/secondary-page-density-trigger.yml
          git commit -m "fix(ui): compact secondary product pages"
          git push origin HEAD:fix/124-secondary-page-density
